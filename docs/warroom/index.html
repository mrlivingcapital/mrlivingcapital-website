<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>War Room — MR LIVING CAPITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F6F1E7;--slate:#5A6662;--slate-dk:#2E3835;--turq:#0F6B62;--turq-soft:#57A99F;--sand:#D9CDB8;--sand-soft:#EFE8DA;--dark:#123B37;--mute:#8C9592;--gold:#B08D4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E7DFCF;font-family:Inter,sans-serif;color:var(--slate-dk);min-height:100vh}
.topbar{background:var(--dark);color:var(--ivory);padding:22px 34px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;border-radius:0 0 34px 34px}
.topbar .wm{font-family:"Space Grotesk";font-weight:700;font-size:19px;letter-spacing:6px}
.topbar .wm span{color:var(--turq-soft)}
.topbar .sub{font-size:11px;letter-spacing:3.5px;color:var(--turq-soft);font-weight:600}
.topbar .spacer{flex:1}
.jabBadge{font-size:12.5px;font-weight:600;letter-spacing:1.2px;padding:9px 18px;border-radius:999px;background:rgba(87,169,159,.16);color:var(--turq-soft)}
.jabBadge.due{background:var(--gold);color:#fff}
.dateChip{font-size:12.5px;color:rgba(246,241,231,.55);letter-spacing:1px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:22px 34px 0}
.tab{font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:2px;padding:11px 22px;border-radius:999px;background:var(--sand-soft);color:var(--slate);cursor:pointer;border:none;transition:.18s}
.tab:hover{background:var(--sand)}
.tab.on{background:var(--turq);color:#fff}
#view{padding:26px 34px 60px;max-width:1500px;margin:0 auto}
.briefHead{font-family:"Cormorant Garamond";font-weight:700;font-size:34px;color:var(--slate-dk);margin:6px 0 4px}
.briefSub{color:var(--slate);font-size:15px;margin-bottom:24px;max-width:760px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.card{background:var(--ivory);border-radius:24px;padding:24px 26px;box-shadow:0 10px 34px rgba(18,59,55,.10);display:flex;flex-direction:column;gap:12px}
.card .prio{display:flex;align-items:center;gap:10px}
.card .pnum{font-family:"Cormorant Garamond";font-weight:700;font-size:30px;color:var(--turq)}
.card .ptype{font-size:10.5px;font-weight:700;letter-spacing:2px;padding:5px 12px;border-radius:999px}
.ptype.jab{background:var(--sand-soft);color:var(--slate)}
.ptype.hook{background:var(--turq);color:#fff}
.card h3{font-family:"Cormorant Garamond";font-weight:700;font-size:23px;line-height:1.22;color:var(--slate-dk)}
.card .pillar{font-size:11px;letter-spacing:2.5px;font-weight:600;color:var(--mute)}
.card .why{font-size:13.5px;color:var(--slate);line-height:1.5}
.card .asof{font-size:11.5px;color:var(--mute);font-style:italic}
.btn{font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:1.6px;padding:13px 24px;border-radius:999px;border:none;cursor:pointer;background:var(--turq);color:#fff;transition:.18s}
.btn:hover{background:#0d5f57}
.btn.ghost{background:var(--sand-soft);color:var(--slate-dk)}
.btn.ghost:hover{background:var(--sand)}
.btn:disabled{opacity:.45;cursor:default}
.figGrid{display:flex;flex-wrap:wrap;gap:22px;margin-top:20px}
figure{margin:0}
figure canvas{width:300px;border-radius:14px;box-shadow:0 12px 36px rgba(18,59,55,.20);display:block}
figcaption{font-size:12px;color:var(--slate);margin-top:8px;text-align:center;max-width:300px;line-height:1.4}
figcaption a{color:var(--turq);font-weight:600;text-decoration:none}
.txtBlock{background:var(--ivory);border-radius:20px;padding:22px 24px;margin-top:16px;box-shadow:0 8px 26px rgba(18,59,55,.08)}
.txtBlock h4{font-family:"Space Grotesk";font-weight:600;font-size:14px;letter-spacing:2px;color:var(--turq);margin-bottom:10px}
.txtBlock pre{white-space:pre-wrap;font-family:Inter;font-size:13.5px;line-height:1.6;color:var(--slate-dk)}
.txtBlock .rowBtns{margin-top:12px;display:flex;gap:10px}
.copyBtn{font-size:12px;font-weight:600;letter-spacing:1px;padding:8px 16px;border-radius:999px;border:none;cursor:pointer;background:var(--sand-soft);color:var(--slate-dk)}
.copyBtn:hover{background:var(--sand)}
.sectionTitle{font-family:"Cormorant Garamond";font-weight:700;font-size:26px;color:var(--slate-dk);margin:30px 0 12px}
.ruleList{list-style:none;display:flex;flex-direction:column;gap:10px;max-width:860px}
.ruleList li{background:var(--ivory);border-radius:16px;padding:15px 20px;font-size:14px;line-height:1.55;box-shadow:0 6px 20px rgba(18,59,55,.07)}
.ruleList li b{color:var(--turq)}
.pillRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{font-size:11.5px;font-weight:600;letter-spacing:1.4px;padding:7px 15px;border-radius:999px;background:var(--sand-soft);color:var(--slate);cursor:pointer;border:none}
.pill.on{background:var(--slate-dk);color:#fff}
.publishedTag{font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:var(--gold)}
.statusLine{margin-top:18px;font-size:13.5px;color:var(--slate);font-style:italic}
h2.viewTitle{font-family:"Cormorant Garamond";font-weight:700;font-size:32px;margin-bottom:6px}
.viewSub{color:var(--slate);font-size:14.5px;margin-bottom:22px;max-width:780px;line-height:1.55}
.weekRow{background:var(--ivory);border-radius:20px;padding:20px 24px;margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(18,59,55,.08)}
.weekDay{font-family:"Space Grotesk";font-weight:700;font-size:15px;letter-spacing:2px;color:var(--turq);width:56px}
.weekMeta{flex:1;min-width:240px}
.weekMeta .wp{font-size:11px;letter-spacing:2.4px;font-weight:600;color:var(--mute)}
.weekMeta .wt{font-family:"Cormorant Garamond";font-weight:700;font-size:21px;color:var(--slate-dk);margin-top:3px}
.weekMeta .wn{font-size:12.5px;color:var(--slate);margin-top:2px}
</style>
</head>

let grainPat=null;
function grain(x,h){if(!grainPat){const g=document.createElement('canvas');g.width=g.height=200;const gx=g.getContext('2d'),id=gx.createImageData(200,200);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=11;}gx.putImageData(id,0,0);grainPat=x.createPattern(g,'repeat');}x.save();x.globalAlpha=.5;x.fillStyle=grainPat;x.fillRect(0,0,W,h);x.restore();}
function rrect(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function wrap(x,t,mw){const ws=String(t).split(' '),ls=[];let c='';for(const w of ws){const s=c?c+' '+w:w;if(x.measureText(s).width>mw&&c){ls.push(c);c=w;}else c=s;}if(c)ls.push(c);return ls;}
function loadImg(src){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
function mkCanvas(h){const S=2,c=document.createElement('canvas');c.width=W*S;c.height=h*S;const x=c.getContext('2d');x.scale(S,S);return[c,x];}
function finish(c,h){const f=document.createElement('canvas');f.width=W;f.height=h;const fx=f.getContext('2d');fx.imageSmoothingQuality='high';fx.drawImage(c,0,0,W,h);return f;}

function bgBase(x,h){x.fillStyle=IVORY;x.fillRect(0,0,W,h);
  let g=x.createRadialGradient(W*.1,0,0,W*.1,0,W*.8);g.addColorStop(0,'rgba(217,205,184,.35)');g.addColorStop(1,'rgba(217,205,184,0)');x.fillStyle=g;x.fillRect(0,0,W,h);}
function softWaves(x,h){
  x.save();
  const w=(col,a,dy)=>{x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.moveTo(0,h);x.lineTo(0,h*.62+dy);
    x.bezierCurveTo(W*.25,h*.52+dy,W*.42,h*.78+dy,W*.68,h*.72+dy);
    x.bezierCurveTo(W*.85,h*.68+dy,W*.95,h*.6+dy,W,h*.62+dy);x.lineTo(W,h);x.closePath();x.fill();};
  w(TURQ_SOFT,.10,90); w(TURQ_SOFT,.13,40); w(TURQ,.10,0);
  x.restore();}
function ringMark(x,s){const cx=W+30,cy=-14,r=150*s;x.save();
  x.strokeStyle='rgba(15,107,98,.55)';x.lineWidth=2.6;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
  x.strokeStyle='rgba(176,141,74,.35)';x.lineWidth=1.6;x.beginPath();x.arc(cx,cy,r*.78,0,Math.PI*2);x.stroke();x.restore();}
function silkRibbon(x,h){const base=h-84;
  const wave=(amp,ph,col,a,y0)=>{x.save();x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.moveTo(0,h);x.lineTo(0,y0);
    for(let i=0;i<=W;i+=8)x.lineTo(i,y0+Math.sin(i/W*Math.PI*2.1+ph)*amp+Math.sin(i/W*Math.PI*4.7+ph*1.6)*amp*.35);
    x.lineTo(W,h);x.closePath();x.fill();x.restore();};
  wave(16,.4,SAND,.42,base-16);wave(11,2.1,'rgba(87,169,159,.30)',1,base);wave(8,4,'rgba(15,107,98,.28)',1,base+16);}

  x.fillText('MR LIVING CAPITAL',W/2,86);x.restore();

function photoPanel(x,img,top,bot){

  x.closePath();x.clip();
  const iw=img.width,ih=img.height,tw=W*.44,th=bot-top,s=Math.max(tw/iw,th/ih);
  const dw=iw*s,dh=ih*s,dx=W*.56-(dw-tw)/2,dy=top-(dh-th)/2;
  x.drawImage(img,dx,dy,dw,dh);

/* ---- text pieces ---- */
function headline(x,t,left,y0,mw,maxSize){
  x.textBaseline='alphabetic';
  const size=maxSize||66;
  const acc=(t.accents||[]).map(a=>a.toUpperCase().replace(/[^A-Z0-9%+.]/g,''));
  let s=size;
  const tokens=String(t.title).toUpperCase().split(' ').map(w=>{const cw=w.replace(/[^A-Z0-9%+.]/g,'');
    return{w,a:acc.some(ac=>ac===cw||(ac.length>3&&cw.length>3&&(ac.includes(cw)||cw.includes(ac))))};});
  let lines=[];
  while(true){
    x.font='700 '+s+'px '+FD;
    lines=[];let cur=[];
    for(const tk of tokens){
      const trial=cur.concat([tk]);
      const txt=trial.map(z=>z.w).join(' ');
      if(x.measureText(txt).width>mw&&cur.length){lines.push(cur);cur=[tk];}
      else cur=trial;
    }
    if(cur.length)lines.push(cur);
    if(lines.length<=4||s<=40)break;
    s-=4;
  }
  let y=y0;const lh=s*1.12;
  for(const ln of lines){let lx=left;
    for(const tk of ln){x.fillStyle=tk.a?TURQ:SLATE_DK;x.fillText(tk.w,lx,y);lx+=x.measureText(tk.w+' ').width;}
    y+=lh;}
  y+=2;x.fillStyle=TURQ;rrect(x,left+2,y,58,6,3);x.fill();
  return y+40;}
function subline(x,t,left,y,mw,maxLines){
  if(!t.sub)return y;
  const acc=(t.subAccent||'').toLowerCase();
  x.font='400 27px '+FB;
  const allSub=wrap(x,t.sub,mw);const lines=allSub.slice(0,maxLines||3);
  if(allSub.length>lines.length)lines[lines.length-1]=lines[lines.length-1].replace(/[—\-,;\s]+$/,'')+' …';
  for(const ln of lines){
    if(acc&&ln.toLowerCase().includes(acc)){
      const i=ln.toLowerCase().indexOf(acc);
      const pre=ln.slice(0,i),mid=ln.slice(i,i+acc.length),post=ln.slice(i+acc.length);
      x.fillStyle=SLATE_DK;x.fillText(pre,left,y);let wpre=x.measureText(pre).width;
      x.fillStyle=TURQ;x.font='600 27px '+FB;x.fillText(mid,left+wpre,y);
      x.font='400 27px '+FB;let wmid=x.measureText(mid).width;
      x.fillStyle=SLATE_DK;x.fillText(post,left+wpre+wmid,y);
    }else{x.fillStyle=SLATE_DK;x.fillText(ln,left,y);}
    y+=38;}
  return y+8;}
function featureRow(x,f,left,y,colW,statW,maxDesc){
  const chipR=36;
  x.fillStyle=SAND_SOFT;x.beginPath();x.arc(left+chipR,y+chipR-6,chipR,0,Math.PI*2);x.fill();
  icon(x,f.icon,left+chipR,y+chipR-6,20);
  const tx=left+chipR*2+26;
  x.fillStyle=TURQ;x.font='600 25px '+FH;let ty=y+22;
  for(const ln of wrap(x,f.title.toUpperCase(),colW-(statW||0)-chipR*2-40)){x.fillText(ln,tx,ty);ty+=30;}
  x.fillStyle=SLATE;x.font='400 22px '+FB;ty+=6;
  const descLines=wrap(x,f.desc,colW-(statW||0)-chipR*2-40);
  const shown=descLines.slice(0,maxDesc||3);
  if(descLines.length>shown.length)shown[shown.length-1]=shown[shown.length-1].replace(/[—\-,;\s]+$/,'')+' …';
  for(const ln of shown){x.fillText(ln,tx,ty);ty+=29;}
  if(f.stat&&statW){
    const sx=left+colW-statW+20;
    x.fillStyle=TURQ;x.font='700 46px '+FH;x.fillText(f.stat,sx,y+42);
    x.fillStyle=SLATE_DK;x.font='500 20px '+FB;let sy=y+72;
    for(const ln of wrap(x,f.statDesc,statW-20)){x.fillText(ln,sx,sy);sy+=26;}
    if(f.source){x.fillStyle=MUTE;x.font='italic 400 17px '+FB;x.fillText(f.source,sx,sy+6);}
  }
  const endY=y+Math.max(ty-y,statW?110:0,86);
  x.strokeStyle='rgba(90,102,98,.14)';x.lineWidth=1.2;
  x.beginPath();x.moveTo(left,endY+10);x.lineTo(left+colW,endY+10);x.stroke();
  return endY+34;}
function quoteBar(x,q,left,y,mw){
  x.font='400 24px '+FB;
  const l1=wrap(x,q.line1,mw-140),l2=wrap(x,q.line2,mw-140);
  const h=56+l1.length*30+l2.length*30+18;
  x.fillStyle=SAND_SOFT;rrect(x,left,y,mw,h,26);x.fill();
  x.fillStyle=TURQ;x.font='700 74px '+FD;x.fillText('“',left+28,y+68);
  let ty=y+52;const tx=left+96;
  x.fillStyle=SLATE_DK;x.font='400 24px '+FB;
  for(const ln of l1){x.fillText(ln,tx,ty);ty+=30;}
  x.fillStyle=TURQ;x.font='600 24px '+FB;
  for(const ln of l2){x.fillText(ln,tx,ty);ty+=30;}
  return y+h+20;}
function sourceLine(x,src,y){x.fillStyle=MUTE;x.font='italic 400 18px '+FB;x.fillText(src,M,y);return y+30;}

const GIVE_WITHHOLD=[['GIVE (free, every post)','Market data · corridor analysis · contrarian takes · ready-vs-off-plan comparisons · the “so-what” behind every number'],
 ['WITHHOLD (paid conversation)','Specific property picks · personalized allocation · which corridor for YOUR profile and ticket size · the shortlist']];
const BANNED=['No “Dubai is booming” hype openers','No Lambo/marina B-roll flex intros','No “DM me for the list” bait','No fake urgency “last units”','No walking-and-talking with no point','No green-screen news reading without a take','No “5 reasons to invest in Dubai” generic lists','No recycled 2021 stats','No “what do you think?” engagement begging'];
</script>
<script>
/* ============ TEXT GENERATORS (Hook → Story → So-What → Withheld CTA) ============ */
function capLinkedIn(t){
  return `${t.hook}\n\n${t.points.map(p=>'→  '+p).join('\n')}\n\nTHE SO-WHAT:\n${t.sowhat}\n\n${t.cta}\n\n—\nData verified: ${t.asof}. Advised like an investor, not a broker.\n${t.tags}`;}
function capInstagram(t){
  return `${t.hook}\n\n${t.points.slice(0,3).map(p=>'→  '+p).join('\n')}\n\n${t.sowhat}\n\n${t.cta}\n\n${t.tags}`;}
function capTelegram(t){
  return `CORRIDOR BRIEF — ${t.asof.toUpperCase()}\n\n${t.title.toUpperCase()}\n\n${t.points.map(p=>'• '+p).join('\n')}\n\nThe so-what: ${t.sowhat}\n\n${t.cta}\n\n— MR LIVING CAPITAL · mrlivingcapital.com`;}
function capWhatsApp(t){
  return `*${t.title.toUpperCase()}*\n\n${t.hook}\n\n${t.points.slice(0,3).map(p=>'• '+p).join('\n')}\n\n${t.sowhat}\n\n${t.cta}`;}
function reelScript(t){
  const pts=t.points.slice(0,3);
  return `[0:00–0:03] HOOK — look into lens, no greeting (verdict + hard number):\n“${t.hook}”\nTEXT OVERLAY: ${t.title.toUpperCase()}\n\n[0:03–0:45] BODY — claim + 3 beats:\n${pts.map((p,i)=>`Beat ${i+1}: ${p}`).join('\n')}\n\n[0:45–0:55] CTA — slower, lower voice:\n“${t.cta}”\n\nDELIVERY: captions ON · cut every 2–3s · key number as overlay · 9:16 · navy blazer, no tie.`;}

/* ============ BRAIN: jab tracker + published ============ */
const LS_PUB='mrlc_pub_v4';
function getPub(){try{return JSON.parse(localStorage.getItem(LS_PUB)||'[]');}catch(e){return[];}}
function markPublished(t){const p=getPub();if(!p.some(z=>z.key===t.key)){p.push({key:t.key,type:t.type,title:t.title,date:new Date().toISOString().slice(0,10)});localStorage.setItem(LS_PUB,JSON.stringify(p));}updateJabBadge();}
function isPublished(k){return getPub().some(z=>z.key===k);}
function jabStatus(){const p=getPub();let j=0;for(let i=p.length-1;i>=0;i--){if(p[i].type==='hook')break;j++;}return{streak:j,due:j>=3};}
function updateJabBadge(){const s=jabStatus(),b=document.getElementById('jabBadge');
  if(s.due){b.textContent='⚖ RIGHT HOOK DUE — post a soft CTA next';b.className='jabBadge due';}
  else{b.textContent=`JAB ${s.streak}/3 — pure value mode`;b.className='jabBadge';}}
function suggestType(){return jabStatus().due?'hook':'jab';}

/* ============ PACK BUILDER ============ */
let _portrait=null;
async function buildPack(t,container){
  container.innerHTML='<div class="statusLine">Rendering pack — one moment…</div>';
  if(!_portrait)_portrait=await loadImg(IMG.portrait);
  if(t.photo)t._photo=await loadImg(IMG[t.photo]||t.photo);else t._photo=null;
  const pages=[];
  pages.push({cv:renderCover(t),label:'01 · COVER (1080×1350)'});
  t.points.forEach((p,i)=>pages.push({cv:renderIdea(t,p,i,t.points.length),label:`${String(i+2).padStart(2,'0')} · SLIDE ${i+1}/${t.points.length}`}));
  if(t.chart)pages.push({cv:renderChartSlide(t),label:`${String(t.points.length+2).padStart(2,'0')} · CHART SLIDE`});
  pages.push({cv:renderCloser(t,_portrait),label:'CLOSER · CALL ME (contact band)'});
  pages.push({cv:renderReel(t),label:'REEL COVER (1080×1920)'});
  const texts=[['LINKEDIN',capLinkedIn(t)],['INSTAGRAM',capInstagram(t)],['TELEGRAM — CORRIDOR BRIEF',capTelegram(t)],['WHATSAPP BROADCAST',capWhatsApp(t)],['REEL SCRIPT (30–60s)',reelScript(t)]];
  /* render UI */
  const safe=t.key;
  let html=`<h2 class="viewTitle">${t.title.toUpperCase()}</h2>
  <div class="viewSub">${t.type==='hook'?'RIGHT HOOK — soft CTA post':'JAB — pure value post'} · ${t.pillar} · data verified ${t.asof}</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn" id="dlAll">⬇ DOWNLOAD ALL ${pages.length} PNGs</button>
    <button class="btn ghost" id="dlTxt">⬇ ALL CAPTIONS (.txt)</button>
    <button class="btn ghost" id="markPub">✓ MARK AS PUBLISHED</button>
  </div>
  <div class="figGrid" id="figs"></div>
  <div class="sectionTitle">Captions & script</div><div id="txts"></div>`;
  container.innerHTML=html;
  const figs=container.querySelector('#figs');
  pages.forEach((p,i)=>{
    const f=document.createElement('figure');f.appendChild(p.cv);
    const cap=document.createElement('figcaption');
    const url=p.cv.toDataURL('image/png');
    cap.innerHTML=`${p.label}<br><a href="${url}" download="MRLC_${safe}_${String(i+1).padStart(2,'0')}.png">Download PNG</a>`;
    f.appendChild(cap);figs.appendChild(f);});
  const txts=container.querySelector('#txts');
  texts.forEach(([name,body])=>{
    const d=document.createElement('div');d.className='txtBlock';
    d.innerHTML=`<h4>${name}</h4><pre></pre><div class="rowBtns"><button class="copyBtn">COPY</button></div>`;
    d.querySelector('pre').textContent=body;
    d.querySelector('.copyBtn').onclick=e=>{navigator.clipboard.writeText(body);e.target.textContent='COPIED ✓';setTimeout(()=>e.target.textContent='COPY',1500);};
    txts.appendChild(d);});
  container.querySelector('#dlAll').onclick=()=>{
    pages.forEach((p,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=p.cv.toDataURL('image/png');a.download=`MRLC_${safe}_${String(i+1).padStart(2,'0')}.png`;a.click();},i*450));};
  container.querySelector('#dlTxt').onclick=()=>{
    const body=texts.map(([n,b])=>`${n}\n${'='.repeat(40)}\n${b}`).join('\n\n\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/plain'}));a.download=`MRLC_${safe}_captions.txt`;a.click();};
  container.querySelector('#markPub').onclick=e=>{markPublished(t);e.target.textContent='PUBLISHED ✓';e.target.disabled=true;};
}

/* ============ VIEWS ============ */
const view=document.getElementById('view');
function topicCard(t,extra){
  const pub=isPublished(t.key);
  return `<div class="card">
    <div class="prio">${extra||''}<span class="ptype ${t.type}">${t.type==='hook'?'RIGHT HOOK':'JAB'}</span>${pub?'<span class="publishedTag">PUBLISHED</span>':''}</div>
    <div class="pillar">${t.pillar.toUpperCase()} · ${t.asof.toUpperCase()}</div>
    <h3>${t.title}</h3>
    <div class="why">${t.hook}</div>
    <button class="btn" data-key="${t.key}">GENERATE PACK →</button>
  </div>`;}
function bindCards(){
  view.querySelectorAll('button[data-key]').forEach(b=>b.onclick=()=>{
    const t=TOPICS.find(z=>z.key===b.dataset.key);buildPack(t,view);window.scrollTo(0,0);});}
function showBrief(){
  const sug=suggestType();
  view.innerHTML=`<div class="briefHead">Daily Brief — ${BRIEF.date}</div>
  <div class="briefSub">${BRIEF.note} ${sug==='hook'?'<b style="color:var(--gold)">3 jabs done — today calls for a right hook (soft CTA).</b>':'Rhythm check: jab mode — pure value, the right hook comes later.'}</div>
  <div class="cards">${BRIEF.items.map(it=>{const t=TOPICS.find(z=>z.key===it.key);
    return `<div class="card">
      <div class="prio"><span class="pnum">${it.prio}</span><span class="ptype ${t.type}">${t.type==='hook'?'RIGHT HOOK':'JAB'}</span>${isPublished(t.key)?'<span class="publishedTag">PUBLISHED</span>':''}</div>
      <div class="pillar">${t.pillar.toUpperCase()} · ${t.asof.toUpperCase()}</div>
      <h3>${t.title}</h3>
      <div class="why">${it.why}</div>
      <button class="btn" data-key="${t.key}">GENERATE PACK →</button></div>`;}).join('')}</div>
  <div class="sectionTitle">The rule behind every pack</div>
  <ul class="ruleList">
    <li><b>Hook → Story → So-What → Withheld CTA.</b> Every caption follows the same spine: hard-number hook, the data beats, what it means, and a CTA that holds back the specific picks.</li>
    <li><b>Jab-jab-jab-right-hook (3:1).</b> Three pure-value posts for every one soft CTA. The badge top-right tracks the rhythm as you mark posts published.</li>
    <li><b>Give vs withhold.</b> We give market data, corridors and the so-what. We withhold specific picks, personal allocation and the shortlist — that's the paid conversation.</li>
  </ul>`;
  bindCards();}
function showBank(){
  const pillars=['ALL',...new Set(TOPICS.map(t=>t.pillar))];
  view.innerHTML=`<h2 class="viewTitle">Topic Bank</h2>
  <div class="viewSub">Every topic is verified data with sources rendered on-slide. Filter by pillar, generate the pack, post. Published topics are tagged.</div>
  <div class="pillRow">${pillars.map((p,i)=>`<button class="pill${i===0?' on':''}" data-p="${p}">${p.toUpperCase()}</button>`).join('')}</div>
  <div class="cards" id="bankCards"></div>`;
  const render=f=>{document.getElementById('bankCards').innerHTML=
    TOPICS.filter(t=>f==='ALL'||t.pillar===f).map(t=>topicCard(t)).join('');bindCards();};
  render('ALL');
  view.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{
    view.querySelectorAll('.pill').forEach(z=>z.classList.remove('on'));p.classList.add('on');render(p.dataset.p);});}
function showWeek(){
  const sug=suggestType();
  view.innerHTML=`<h2 class="viewTitle">This Week's Plan</h2>
  <div class="viewSub">Cadence: Mon reel · Wed carousel · Fri carousel · Sun reel. Suggestions skip published topics and respect the 3:1 rhythm${sug==='hook'?' — <b style="color:var(--gold)">right hook due</b>':''}.</div>`+
  CADENCE.map(c=>{
    const pool=TOPICS.filter(t=>t.pillar===c.pillar&&!isPublished(t.key));
    const t=pool.find(z=>z.type===sug)||pool[0];
    return `<div class="weekRow"><div class="weekDay">${c.day.toUpperCase()}</div>
    <div class="weekMeta"><div class="wp">${c.pillar.toUpperCase()} · ${c.fmt}</div>
    <div class="wt">${t?t.title:'Bank empty — add a topic'}</div>
    <div class="wn">${c.note}</div></div>
    ${t?`<button class="btn" data-key="${t.key}">PACK →</button>`:''}</div>`;}).join('');
  bindCards();}
function showConvo(){
  view.innerHTML=`<h2 class="viewTitle">Conversation Engine</h2>
  <div class="viewSub">Comment → DM → call. DM every keyword commenter within 1 hour. Never pitch in the first message.</div>
  <div class="sectionTitle">1 · Keyword → DM openers</div>
  <ul class="ruleList">${KEYWORD_DM.map(([k,v])=>`<li><b>${k}</b> — ${v}</li>`).join('')}</ul>
  <div class="sectionTitle">2 · ACA flow (every DM)</div>
  <ul class="ruleList">${ACA.map(s=>`<li>${s}</li>`).join('')}</ul>
  <div class="sectionTitle">3 · Qualifying (max 2 per message)</div>
  <ul class="ruleList">${QUALIFYING.map(s=>`<li>${s}</li>`).join('')}</ul>
  <div class="sectionTitle">4 · Follow-up cadence</div>
  <ul class="ruleList">${FOLLOWUP.map(s=>`<li>${s}</li>`).join('')}</ul>
  <div class="sectionTitle">5 · Book the call</div>
  <ul class="ruleList"><li>“${BOOK_CALL}”</li></ul>`;}
function showPlaybook(){
  view.innerHTML=`<h2 class="viewTitle">The Playbook</h2>
  <div class="viewSub">The rules the brain enforces on every post. Distilled from Serhant's content matrix, Hormozi's hooks & Core Four, and carousel-first research.</div>
  <div class="sectionTitle">Hook → Story → So-What → Withheld CTA</div>
  <ul class="ruleList">${HOOK_RULES.map(s=>`<li>${s}</li>`).join('')}</ul>
  <div class="sectionTitle">Give vs Withhold (hard rule)</div>
  <ul class="ruleList">${GIVE_WITHHOLD.map(([k,v])=>`<li><b>${k}</b><br>${v}</li>`).join('')}</ul>
  <div class="sectionTitle">Jab-jab-jab-right-hook (3:1)</div>
  <ul class="ruleList"><li>Three pure-value posts for every one soft CTA. Content earns attention; the withheld conversation converts it. The tracker badge keeps the rhythm honest.</li></ul>
  <div class="sectionTitle">Never do</div>
  <ul class="ruleList">${BANNED.map(s=>`<li>${s}</li>`).join('')}</ul>`;}

/* ============ SHELL ============ */
const VIEWS=[['DAILY BRIEF',showBrief],['TOPIC BANK',showBank],['WEEK PLAN',showWeek],['CONVERSATIONS',showConvo],['PLAYBOOK',showPlaybook]];
const tabsEl=document.getElementById('tabs');
VIEWS.forEach(([name,fn],i)=>{
  const b=document.createElement('button');b.className='tab'+(i===0?' on':'');b.textContent=name;
  b.onclick=()=>{tabsEl.querySelectorAll('.tab').forEach(z=>z.classList.remove('on'));b.classList.add('on');fn();};
  tabsEl.appendChild(b);});
document.getElementById('dateChip').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
updateJabBadge();
showBrief();
</script>
</body>
</html>
