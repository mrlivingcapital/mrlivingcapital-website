};
const TOPICS=[
{key:'ad-rush',type:'hook',pillar:'Commercial',asof:'August 2026',engine:'Direct Business',title:'Abu Dhabi is investing for decades, not years.',accents:['investing for decades'],sub:'The sovereign capital wave is not a headline. It is a structural reallocation. Modon, Reem Island, and ADGM are not projects — they are decades of cash flow compressed into launch windows.',subAccent:'structural reallocation',points:['Abu Dhabi sovereign wealth is deploying into real estate at a scale that makes private capital look like a rounding error.','Modon is not a developer. It is a capital allocation vehicle with a 30-year mandate.','Reem Island is becoming the financial district backup plan — not the main stage, but the stage where the real money sits.','ADGM licensing and regulatory framework is pulling hedge funds, family offices, and fintech from Dubai — not replacing it, but diversifying the corridor.','The entry ticket for serious exposure is rising. The window for retail-sized participation is closing as institutional capital locks up prime plots.'],cta:'Are you watching Abu Dhabi as a diversification play, or are you still treating it as Dubai\'s smaller neighbour?',tags:'#DubaiRealEstate #AbuDhabi #Commercial #Investment #MRlivingcapital',source:'ADREC 2025 / Modon strategy documents / DLD commercial data',photo:'reem',sowhat:'Abu Dhabi is not launching projects. It is deploying sovereign capital for decades. The retail window is closing.'},
{key:'uk-exodus',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Think Differently',title:'16,500 millionaires left the UK this year.',accents:['16,500 millionaires'],sub:'That is not a migration. That is a capital evacuation. And the UAE is the primary receiving corridor — again. But receiving them is not the same as capturing their investment.',subAccent:'capital evacuation',points:['Henley & Partners data: 16,500 UK millionaires exited in 2025-2026, up from 9,500 the prior year.','The UAE received the largest share of this capital flow for the third consecutive year.','These are not property tourists. They are family offices, hedge fund principals, and tech founders looking for jurisdictional stability.','They do not buy off-plan studios. They buy commercial freehold, bulk residential, and development land.','The opportunity is not selling them a flat. It is becoming the local partner who structures their first UAE allocation.'],cta:'Are you trying to sell property to millionaires, or are you trying to become the advisor they call before they buy?',tags:'#DubaiRealEstate #UK #Millionaires #CapitalFlow #MRlivingcapital',source:'Henley & Partners Wealth Report 2026 / DLD transaction data',photo:'skyline',sowhat:'16,500 UK millionaires left. The UAE got the most. But getting them is geography — keeping them is architecture.'},
{key:'gold-line',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Market Detective',title:'Dubai just drew a Gold Line through 55 mega projects.',accents:['Gold Line','55 mega projects'],sub:'AED 34 billion. 42 kilometres. Fully underground. This is not a metro extension. It is a capital relocation map. Every station is a land value event.',subAccent:'capital relocation map',points:['The Gold Line connects Dubai Investment Park to Al Mamzar via 14 stations, 11 of which are interchange hubs.','55 mega-developments are now within 800 metres of a Gold Line station — that is the walkability premium zone.','Underground construction means no surface disruption during build, but higher per-kilometre cost — AED 810M per km.','The line is funded 60% by Dubai sovereign instruments, 40% by private infrastructure bonds — not taxpayer revenue.','Completion target is 2032. The land value appreciation curve starts now, peaks at ribbon-cutting, and normalises 18 months after.'],cta:'Are you buying near a Gold Line station for the 2032 completion, or are you buying the corridor that feeds into it?',tags:'#DubaiRealEstate #GoldLine #Infrastructure #MarketIntelligence #MRlivingcapital',source:'RTA Dubai / Dubai 2040 Urban Master Plan / DLD corridor data',photo:'map',sowhat:'The Gold Line is a 42km capital relocation map. Buy the corridors that feed into it, not just the stations.'},
{key:'wynn-date',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Market Detective',title:'Wynn just locked its date. September 2027.',accents:['locked its date','September 2027'],sub:'The only gaming-integrated resort in the UAE just went from "planned" to "firm." That is not hospitality news. That is a RAK land value event with a hard deadline.',subAccent:'RAK land value event',points:['Wynn Al Marjan Island: $5.7B investment, 1,500 rooms, gaming-integrated — the only licence of its kind in the UAE.','September 2027 is now a firm opening date, backed by construction milestones and contractor bonds.','RAK real estate transactions jumped 34% in Q2 2026, driven by Wynn-adjacent land and hospitality plays.','The corridor is still priced at 2024 levels in many pockets — a gap that closes as the opening approaches.','Smart money is not buying the resort. It is buying the service corridor, staff accommodation, and retail adjacencies.'],cta:'Are you buying Wynn-adjacent land for the casino, or for the 4,000 staff who need housing?',tags:'#DubaiRealEstate #RAK #Wynn #Gaming #MRlivingcapital',source:'Wynn Resorts investor filings / RAK Real Estate data / DLD transaction records',photo:'wynn',sowhat:'Wynn is a deadline, not a dream. September 2027 is firm. The land value gap closes between now and then.'},
{key:'modon-reem',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Market Detective',title:'Modon is stacking Reem Island.',accents:['stacking Reem Island'],sub:'AED 11.97 billion in one quarter. That is not a launch. That is a sovereign statement. And it changes the risk-reward for every private investor in the corridor.',subAccent:'sovereign statement',points:['Modon Properties — Abu Dhabi sovereign-backed — recorded AED 11.97B in Q2 2026 sales on Reem Island alone.','The scale of capital deployment makes private developers look like niche players.','Modon is not competing on price. It is competing on certainty — sovereign backing means no delivery risk, no escrow anxiety.','Private investors in Reem Island now face a choice: compete with Modon on product, or ride the infrastructure wave Modon is creating.','The real play is not buying Modon units. It is buying the adjacencies — retail, office, and hospitality — that Modon\'s population will need.'],cta:'Are you competing with Modon, or are you positioning to serve the ecosystem Modon is building?',tags:'#DubaiRealEstate #AbuDhabi #Modon #ReemIsland #MRlivingcapital',source:'Modon Properties Q2 2026 reporting / ADREC transaction data',photo:'reem',sowhat:'Modon is not a developer. It is a sovereign capital allocation engine. Compete with it, or serve the ecosystem it creates.'},
{key:'p26',type:'jab',pillar:'Market Intelligence',asof:'July 2026',engine:'Think Differently',title:'Developers stopped launching.',accents:['stopped launching'],sub:'Not because they ran out of land. Because they ran out of buyers willing to pay 2025 prices in a 2026 market. The launch pipeline is a leading indicator.',subAccent:'leading indicator',points:['Q2 2026 saw 47% fewer new project launches than Q2 2025.','The average launch price per sq ft dropped 8% from Q1 to Q2 2026.','Developers are holding land banks and waiting for price recovery rather than launching into weak demand.','This is not a supply shortage. It is a demand-price mismatch.','When launches resume, they will likely be at lower price points or with more aggressive payment plans.'],cta:'Are you waiting for the next launch wave, or are you buying ready stock while developers are frozen?',tags:'#DubaiRealEstate #Developers #Launch #MarketIntelligence #MRlivingcapital',source:'DLD launch data / Anarock Q2 2026 report',photo:'skyline',sowhat:'Developers freezing launches is not a supply crisis. It is a price correction signal. Buy ready stock while they wait.'},
{key:'p27',type:'jab',pillar:'Commercial',asof:'July 2026',engine:'Think Differently',title:'Offices tripled.',accents:['tripled'],sub:'Not in price. In rental velocity. The commercial market is tightening while residential debates whether it is a buyer or seller market.',subAccent:'commercial market is tightening',points:['Grade A office rents in DIFC and Business Bay rose 22% year-on-year.','Vacancy rates in prime commercial dropped below 8% for the first time since 2019.','The shift to hybrid work did not kill office demand — it fragmented it. Smaller, flexible spaces are in higher demand than large floorplates.','Commercial yields (7-9%) now significantly outpace residential gross yields (5-6%).','The barrier to entry is higher — commercial requires more capital, more due diligence, and longer lease structures.'],cta:'Is your portfolio 100% residential because you understand it, or because you have never looked at the office numbers?',tags:'#DubaiRealEstate #Commercial #Office #Yield #MRlivingcapital',source:'CBRE Dubai Commercial Q2 2026 / DLD commercial data',photo:'businessbay',sowhat:'Office rents tripled in velocity, not just price. The commercial yield gap is the story nobody is telling.'},
{key:'p28',type:'jab',pillar:'Advisory Warnings',asof:'July 2026',engine:'Think Differently',title:'Prices dipped two months.',accents:['dipped two months'],sub:'February to April 2026. A 4-7% correction. Not a crash. A breath. And most buyers panicked while smart money deployed.',subAccent:'smart money deployed',points:['Average price per sq ft dropped from AED 1,980 in February to AED 1,840 in April 2026.','The dip was driven by geopolitical tension, not structural weakness.','Transaction volume actually increased during the dip — 12% more deals in April than March.','Cash buyers dominated the dip period, accounting for 78% of transactions.','The market recovered to AED 1,900+ by June 2026. The dip was a 60-day window.'],cta:'Did you freeze during the dip, or did you treat it as a 60-day deployment window?',tags:'#DubaiRealEstate #PriceCorrection #Dip #AdvisoryWarnings #MRlivingcapital',source:'DLD monthly transaction data / Anarock price index',photo:'interior',sowhat:'A 4-7% dip over 60 days is not a crash. It is a deployment window. Smart money bought. Everyone else watched.'},
{key:'p29',type:'jab',pillar:'Market Intelligence',asof:'Week of July 20',engine:'Market Detective',title:'Dubai South led the city.',accents:['led the city'],sub:'Not in price. In transaction volume. The most affordable corridor is also the most active — and that tells you something about where the demand is actually coming from.',subAccent:'where the demand is actually coming from',points:['Dubai South recorded 2,847 transactions in the week of July 20 — the highest of any corridor.','The average ticket size was AED 1.2M, 40% below the city average.','60% of buyers were first-time investors, not end-users.','The appeal is entry price, not location premium. Buyers are price-sensitive, not lifestyle-driven.','Dubai South is absorbing the demand that can no longer afford JVC, Al Furjan, or Town Square.'],cta:'Are you buying Dubai South because you believe in the corridor, or because it is the only place your budget still works?',tags:'#DubaiRealEstate #DubaiSouth #Volume #MarketIntelligence #MRlivingcapital',source:'DLD weekly transaction data / corridor analysis',photo:'south',sowhat:'Dubai South leading in volume, not price, reveals the real demand profile: price-sensitive first-time investors.'},
{key:'p30',type:'jab',pillar:'Market Intelligence',asof:'Week of July 6-10',engine:'Think Differently',title:'AED 15.6 billion in "dead" July.',accents:['"dead" July'],sub:'July is supposed to be quiet. Ramadan is over. Summer is here. Everyone is on holiday. Except the transaction register.',subAccent:'Except the transaction register',points:['AED 15.6B in transactions during the week of July 6-10, 2026.','This is 23% higher than the same week in 2025.','The "summer slowdown" narrative is outdated. Dubai real estate does not pause for heat anymore.','Cash buyers do not take summer holidays from capital deployment.','The lesson: market timing based on seasonality is a retail investor mistake.'],cta:'Do you still believe in summer slowdowns, or have you noticed that capital does not take holidays?',tags:'#DubaiRealEstate #July #Seasonality #MarketIntelligence #MRlivingcapital',source:'DLD weekly transaction register',photo:'marina',sowhat:'AED 15.6B in "dead" July. Seasonality is a retail myth. Capital does not take summer holidays.'},
{key:'p31',type:'jab',pillar:'Investor Education',asof:'H1 2026',engine:'Think Differently',title:'Ready beat off-plan.',accents:['Ready beat off-plan'],sub:'In H1 2026, ready properties outperformed off-plan on both yield and capital preservation. The narrative is shifting, and most investors are still reading the old script.',subAccent:'narrative is shifting',points:['Ready properties delivered average gross yields of 6.2% vs 4.8% for off-plan (projected).','Off-plan price appreciation slowed to 3% annually vs 8% for ready stock in prime corridors.','Delivery risk, escrow anxiety, and payment plan fatigue are pushing serious capital toward ready stock.','The premium for ready — typically 15-20% above off-plan — has compressed to 8-12%.','Smart money is buying ready, renting immediately, and using income to fund the next purchase.'],cta:'Are you still buying off-plan for "future appreciation" while ready stock pays you today?',tags:'#DubaiRealEstate #ReadyStock #OffPlan #Yield #InvestorEducation #MRlivingcapital',source:'DLD H1 2026 analysis / Anarock ready vs off-plan report',photo:'interior',sowhat:'Ready stock beat off-plan in H1 2026 on yield and preservation. The narrative has shifted. Most investors missed it.'},
{key:'p32',type:'jab',pillar:'Commercial',asof:'July 2026',engine:'Think Differently',title:'Where yield actually is.',accents:['yield actually is'],sub:'Not in off-plan residential. Not in luxury apartments. In commercial ready stock with existing tenants and verifiable rent rolls.',subAccent:'commercial ready stock',points:['Commercial ready stock in Business Bay and DIFC yields 7.5-9.2% net.','Residential ready stock in the same corridors yields 5.2-6.1% gross.','The yield gap is not a secret. It is a capital barrier — commercial requires more ticket size and more expertise.','Office units under 1,000 sq ft are the sweet spot: lower capital, higher rent per sq ft, easier tenant replacement.','The risk is not vacancy. It is tenant quality. One bad tenant can cost 6 months of income.'],cta:'Are you chasing residential yield because it is familiar, or because you have never underwritten a commercial lease?',tags:'#DubaiRealEstate #Commercial #Yield #ReadyStock #MRlivingcapital',source:'CBRE commercial yield data / DLD rental register',photo:'businessbay',sowhat:'The yield is in commercial ready stock. The barrier is capital and expertise, not information.'},
{key:'p33',type:'hook',pillar:'The Strategist',asof:'July 2026',engine:'Masoud Has an Opinion',title:'Why I joined Strada.',accents:['joined Strada'],sub:'Not for the commission split. Not for the brand. For the one thing that matters: access to off-plan inventory before it hits the market.',subAccent:'access to off-plan inventory',points:['Strada is not a traditional agency. It is an off-plan specialist with direct developer relationships.','Most investors see launches on Instagram. Strada clients see floor plans 30 days before.','The difference between early access and public launch is 8-15% price advantage.','I did not join to sell more. I joined to buy better for my clients.','The alignment: when my clients get early access, they get better units. When they get better units, they come back.'],cta:'Are you buying off-plan from public launches, or do you have a pipeline that sees inventory before the market?',tags:'#DubaiRealEstate #Strada #OffPlan #Access #MRlivingcapital',source:'Personal advisory practice / Strada UAE partnership',photo:'interior',sowhat:'I joined Strada for early access, not commission. The 30-day advantage is worth more than any split.'},
{key:'p34',type:'jab',pillar:'Commercial',asof:'July 2026',engine:'Think Differently',title:'Office shortage to 2028.',accents:['Office shortage'],sub:'The pipeline is not keeping up with demand. And the new supply coming online is 60% pre-leased before completion.',subAccent:'60% pre-leased',points:['Dubai office stock is growing at 3% annually. Demand is growing at 6%.','The shortage is concentrated in Grade A and flexible office space. Grade B is oversupplied.','New office buildings launching in 2026 are 60% pre-leased — often to single anchor tenants.','The opportunity is not in new Grade A towers. It is in retrofitting old Grade B stock to flexible office standards.','Investors who understand tenant mix, lease structures, and service charge allocation will capture the yield.'],cta:'Are you looking at office supply as one market, or do you separate Grade A from Grade B and flexible?',tags:'#DubaiRealEstate #Commercial #Office #Supply #MRlivingcapital',source:'CBRE Dubai Office Outlook 2026-2028 / DLD commercial pipeline',photo:'businessbay',sowhat:'Office shortage to 2028 is real, but only in Grade A and flexible. Grade B is a different game entirely.'},
{key:'p35',type:'jab',pillar:'Market Intelligence',asof:'July 2026',engine:'Think Differently',title:'Sell-outs still happen.',accents:['Sell-outs still happen'],sub:'In a market where launches are down 47%, the projects that sell out in 48 hours are not accidents. They are signals.',subAccent:'signals',points:['Three projects sold out within 48 hours of launch in Q2 2026.','All three were in prime corridors: Downtown, Dubai Hills, and Palm Jumeirah.','All three were priced at 15-20% premium to comparable ready stock.','The buyers were not end-users. They were family offices and sovereign-adjacent capital.','Sell-outs in a slow market reveal where the smart money is willing to pay premium.'],cta:'Do you chase sell-out projects because they are hot, or do you analyze what the sell-out reveals about capital flow?',tags:'#DubaiRealEstate #SellOut #Prime #MarketIntelligence #MRlivingcapital',source:'DLD launch data / developer announcements',photo:'palm',sowhat:'Sell-outs in a slow market are not hype. They are capital flow signals. Follow the money, not the crowd.'},
{key:'p36',type:'jab',pillar:'Investor Education',asof:'July 2026',engine:'Think Differently',title:'How to read a launch.',accents:['read a launch'],sub:'Most investors read the brochure. I read the escrow, the payment plan, the developer\'s last three projects, and the comparable ready stock. Here is the checklist.',subAccent:'checklist',points:['Check the escrow funding percentage. Anything under 80% funded at launch is a red flag.','Map the payment plan against construction milestones. Front-loaded plans benefit the developer, not you.','Review the developer\'s last three delivered projects. Average delay is your expected delay.','Compare launch price to ready stock in the same corridor. A 30% premium needs a 30% justification.','Check the unit mix. If 70% are studios and 1-beds, the building is designed for investors, not end-users.'],cta:'Do you have a launch checklist, or do you buy based on the render and the payment plan headline?',tags:'#DubaiRealEstate #Launch #DueDiligence #InvestorEducation #MRlivingcapital',source:'Personal advisory framework / DLD escrow data',photo:'interior',sowhat:'Reading a launch means reading escrow, payment plans, and delivery history. The brochure is marketing. The numbers are truth.'},
{key:'p37',type:'jab',pillar:'Investor Education',asof:'July 2026',engine:'Direct Business',title:'Golden Visa 2026 rules.',accents:['Golden Visa','2026 rules'],sub:'The threshold is still AED 2M. But the enforcement is tighter. And the rejection rate is rising for applications that do not meet the new documentation standards.',subAccent:'rejection rate is rising',points:['AED 2M property investment still qualifies for the 10-year Golden Visa.','New 2026 rules require the property to be fully paid — mortgaged properties no longer qualify unless 50%+ equity is proven.','Off-plan properties now require 50% payment completion and a valid Oqood to qualify.','Joint ownership: each owner must invest AED 2M individually. Shared ownership at AED 4M total does not qualify two applicants.','Processing time has increased to 15-20 working days due to enhanced background checks.'],cta:'Is your Golden Visa application based on 2025 assumptions, or have you updated for the 2026 documentation requirements?',tags:'#DubaiRealEstate #GoldenVisa #UAE #InvestorEducation #MRlivingcapital',source:'UAE ICP 2026 guidelines / DLD Golden Visa property requirements',photo:'mosque',sowhat:'Golden Visa rules tightened in 2026. Mortgaged properties and joint ownership now have stricter requirements. Update your paperwork.'},
{key:'story-nearmiss',type:'jab',pillar:'Behind the Deal',asof:'August 2026',engine:'Real Investor Stories',title:'The property I almost bought.',accents:['almost bought'],sub:'It looked perfect on paper. Same corridor, same budget, same developer. I walked away three days before signing. Here is why I still think about it.',subAccent:'walked away',points:['The layout had a fatal flaw: no natural light in the second bedroom. Agents do not photograph that angle.','Service charges were 18% higher than advertised — buried in the SPA annex, not the headline.','The developer had delayed two previous projects by 14 months average. I checked RERA, not Google.','The "garden view" was a loading bay for the retail podium. Drone footage revealed it.','I bought two streets away six months later for 8% less per sq ft and 22% lower service charges.'],cta:'Have you ever walked away from a deal that looked perfect? What was the signal?',tags:'#DubaiRealEstate #PropertyInvestment #InvestorEducation #BehindTheDeal #MRlivingcapital',source:'Personal deal archive / DLD RERA records',photo:'interior',sowhat:'The best deal you ever make might be the one you walk away from. Verify what agents do not show.'},
{key:'story-walkaway',type:'hook',pillar:'Behind the Deal',asof:'August 2026',engine:'Real Investor Stories',title:'Why I walked away from a 20 million dirham deal.',accents:['walked away','20 million'],sub:'The numbers worked. The developer was reputable. The corridor was right. But one clause in the escrow structure made me close the laptop and call my lawyer.',subAccent:'close the laptop',points:['The escrow release schedule was front-loaded: 70% paid before 40% construction completion.','The developer had the right to use escrow funds for "marketing and sales infrastructure" — not just construction.','Comparable projects by the same developer had taken 18 months longer than promised.','The payment plan was post-handover over 3 years, but the SPA allowed the developer to demand full settlement if construction paused for 90 days.','I told the client: "This is not a property problem. This is a capital structure problem."'],cta:'Would you kill a deal over one bad clause, or negotiate around it?',tags:'#DubaiRealEstate #OffPlan #DueDiligence #BehindTheDeal #MRlivingcapital',source:'Client advisory record / SPA review',photo:'businessbay',sowhat:'AED 20M deals die over one paragraph. Read the escrow release schedule before you read the floor plan.'},
{key:'story-negotiation',type:'jab',pillar:'Behind the Deal',asof:'August 2026',engine:'Real Investor Stories',title:'The negotiation that taught me everything.',accents:['taught me everything'],sub:'It was my first secondary purchase for a client. I thought the price was fixed. The seller thought I was desperate. We were both wrong.',subAccent:'both wrong',points:['The listed price was AED 2.4M. I offered AED 2.15M with a 14-day close. The seller laughed.','I discovered the seller had already bought his next property and needed the transfer done before Ramadan.','I did not lower my price. I shortened the close to 7 days and offered to handle the NOC chase myself.','He accepted at AED 2.18M — AED 220K below list — because speed was worth more than price to him.','The lesson: price is only one currency. Time, certainty, and hassle-removal are the others.'],cta:'When you negotiate, do you only talk about price — or do you find the real currency?',tags:'#DubaiRealEstate #Negotiation #SecondaryMarket #BehindTheDeal #MRlivingcapital',source:'Personal transaction record',photo:'marina',sowhat:'The best negotiators do not win on price. They win on understanding what the other side actually needs.'},
{key:'story-firstcommercial',type:'jab',pillar:'Behind the Deal',asof:'August 2026',engine:'Real Investor Stories',title:'How I underwrote my first commercial deal.',accents:['first commercial'],sub:'I had done residential deals. Office was different. The yield looked higher, but the vacancy risk was invisible until I ran the numbers properly.',subAccent:'invisible',points:['The gross yield was 8.2%. The net yield after service charges, fit-out, and vacancy allowance was 5.1%.','The tenant had a break clause at year 3. I modelled cash flow with a 6-month re-letting gap.','The building had 34% parking allocation per unit. The market standard was 50%. That caps tenant quality.','I negotiated a 3-year rent freeze instead of a 5% annual escalation — because tenant retention beats theoretical yield.','The deal closed. The tenant is still there 18 months later. The "lower" yield is now higher than the alternative.'],cta:'Do you underwrite commercial deals with residential logic? What metric are you missing?',tags:'#DubaiRealEstate #Commercial #Yield #BehindTheDeal #MRlivingcapital',source:'Personal underwriting model / lease records',photo:'businessbay',sowhat:'Commercial real estate punishes lazy underwriting. Gross yield is a fantasy. Net yield with vacancy stress is the only truth.'},
{key:'opinion-jvc',type:'hook',pillar:'The Strategist',asof:'August 2026',engine:'Masoud Has an Opinion',title:'I would not buy in JVC right now.',accents:['would not buy','JVC'],sub:'And it has nothing to do with the community. It has everything to do with what is coming next door.',subAccent:'nothing to do with the community',points:['JVC delivered 8,200 units in 2024-2025. Another 4,000+ are scheduled for 2026-2027 handover.','Rental growth in JVC slowed to 3% annually — down from 12% in 2023. Supply is absorbing demand.','The "affordable" entry point is no longer unique. Al Furjan, Dubai South, and Town Square now compete at the same ticket.','Service charges in newer JVC clusters are rising faster than rents — squeezing net yields.','I am not saying JVC is bad. I am saying the risk-reward has shifted, and most buyers are pricing yesterday.'],cta:'Are you still buying JVC at 2023 logic, or have you recalculated for 2026 supply?',tags:'#DubaiRealEstate #JVC #Supply #Risk #MRlivingcapital',source:'DLD transaction data / supply pipeline reports',photo:'jvc',sowhat:'JVC is not a bad area. It is a bad entry price for the supply wave coming. Buy the math, not the memory.'},
{key:'opinion-mortgage',type:'hook',pillar:'The Strategist',asof:'August 2026',engine:'Masoud Has an Opinion',title:'Mortgage buyers are subsidizing cash buyers.',accents:['subsidizing'],sub:'This is not a conspiracy theory. It is a structural fact of the Dubai market in 2026. And if you are paying cash, you should understand what the other side is doing for you.',subAccent:'structural fact',points:['Off-plan payment plans are effectively zero-interest leverage for developers. The developer gets your capital today and delivers in 3 years.','Cash buyers get priority allocation, bulk discounts, and better unit selection — because they close faster.','Mortgage buyers pay 2-3% bank fees, 4% DLD, and valuation costs — adding 6-8% to entry price before appreciation.','When prices dip 4-7% (as they did Feb-Apr 2026), mortgage buyers are underwater. Cash buyers are just less rich.','The market rewards liquidity. Mortgage is a tool, but in this cycle, it is an expensive tool.'],cta:'Are you buying with cash because you are smart, or because you have no choice? Does it matter?',tags:'#DubaiRealEstate #Mortgage #CashBuyers #MarketIntelligence #MRlivingcapital',source:'UAE Central Bank / DLD mortgage data / Anarock H1 2026',photo:'interior',sowhat:'Cash is not just king in Dubai real estate. It is the entire kingdom. Mortgage buyers pay a premium for the privilege of leverage.'},
{key:'opinion-dubaisouth',type:'hook',pillar:'The Strategist',asof:'August 2026',engine:'Masoud Has an Opinion',title:'Dubai South is not for everyone.',accents:['not for everyone'],sub:'If you are an end-user who works near Expo, it might be perfect. If you are an investor expecting 2021-style appreciation, you are buying the wrong map.',subAccent:'wrong map',points:['Dubai South has 45,000+ units in the pipeline through 2028. That is not scarcity. That is a supply laboratory.','The Expo effect is real for foot traffic. It is not real for residential capital growth — yet.','There is no metro connection to the residential clusters until 2028 at earliest. Car-dependency caps rental demand.','Yields look attractive on paper because entry prices are low. But vacancy periods are 20-30% longer than established corridors.','I would buy Dubai South for my own residence before I bought it for rental income. That is the honest split.'],cta:'Are you buying Dubai South for where it is today, or where you hope it will be in 2030?',tags:'#DubaiRealEstate #DubaiSouth #ExpoCity #InvestorEducation #MRlivingcapital',source:'DLD supply data / rental performance reports',photo:'south',sowhat:'Dubai South is a long-term infrastructure play, not a yield play. Buy it if you can wait 7 years, not if you need rent in 12 months.'},
{key:'warning-escrow',type:'mistake',pillar:'Advisory Warnings',asof:'August 2026',engine:'Think Differently',title:'The off-plan payment plan trap.',accents:['trap'],sub:'"Only 20% on booking." Sounds great. Until you realize the next 50% is due before the building is half built. That is not a payment plan. That is a capital extraction plan.',subAccent:'capital extraction',points:['The average off-plan payment plan now requires 60-70% of total price before 50% construction completion.','If the developer delays, your capital is locked in an escrow that may not cover refund obligations fully.','Post-handover payment plans sound safe, but many require full SPA settlement before title transfer.','Some developers use "construction-linked" schedules that front-load payments against early milestones.','The safe structure: 50% at handover, 50% post-handover over 2-3 years, with title transfer at 50% payment.'],cta:'Have you read your payment plan milestone schedule, or just the headline "20% on booking"?',tags:'#DubaiRealEstate #OffPlan #Escrow #AdvisoryWarnings #MRlivingcapital',source:'SPA analysis / DLD escrow regulations',photo:'interior',sowhat:'Payment plans are marketing tools disguised as financial structures. Read the milestone dates.'},
{key:'warning-guaranteed',type:'mistake',pillar:'Advisory Warnings',asof:'August 2026',engine:'Think Differently',title:'Why "guaranteed yield" is a red flag.',accents:['red flag'],sub:'If a developer guarantees you 8% yield for 3 years, ask one question: who is paying the difference when the actual rent is 5%?',subAccent:'who is paying the difference',points:['Guaranteed yield schemes are not insurance. They are marketing subsidies built into the sale price.','The "guarantee" is often paid from a pool funded by a 5-10% markup on the unit price.','After the guarantee period, you own a property priced 15% above market, with no subsidy.','RERA Dubai explicitly discourages guaranteed yield advertising.','Smart money wants transparent yield based on actual comparable rents.'],cta:'Would you pay 10% more just to get your own money back as "guaranteed rent"?',tags:'#DubaiRealEstate #Yield #RedFlag #AdvisoryWarnings #MRlivingcapital',source:'RERA guidelines / market comparable analysis',photo:'map',sowhat:'Guaranteed yield is a loan you do not know you took, repaid with your own overpayment.'},
{key:'mistake-escrow',type:'mistake',pillar:'Advisory Warnings',asof:'August 2026',engine:'Real Investor Stories',title:'I bought off-plan without checking the escrow.',accents:['without checking'],sub:'This was 2019. The developer was "reputable." The project was "on track." The escrow was 40% funded. I did not know what that meant until I learned the hard way.',subAccent:'hard way',points:['The escrow account is supposed to hold 100% of buyer funds, released only against verified construction milestones.','40% funded meant the developer had already withdrawn 60% against "pre-construction costs."','When construction stalled, there was not enough escrow left to hire a new contractor. Delay: 26 months.','I now check escrow funding percentage, milestone release schedule, and engineer verification firm.','Escrow is not a box that gets ticked. It is a living bank account that tells you if the developer is eating the seed corn.'],cta:'Do you know your off-plan project\'s current escrow funding percentage?',tags:'#DubaiRealEstate #OffPlan #Escrow #Mistake #MRlivingcapital',source:'Personal investment record / DLD escrow enquiry',photo:'creek',sowhat:'Escrow is a thermometer. If it is underfunded, the patient is already sick.'},
{key:'mistake-corridor',type:'mistake',pillar:'The Strategist',asof:'August 2026',engine:'Real Investor Stories',title:'The corridor I got wrong.',accents:['got wrong'],sub:'I believed the infrastructure timeline. The government brochure said 2024. It is 2026. The metro extension is still "under study." My yield model is broken.',subAccent:'broken',points:['I bought based on a 2024 metro completion announced in 2021. Three years later, it is not even tendered.','Infrastructure promises are not contracts. They are political intentions with budgets that change.','Without the metro, rental demand is 30% lower than projected.','I held too long hoping the metro would save the thesis. I sold at cost and redeployed.','The rule now: I only buy what exists today. Future infrastructure is a bonus, never the thesis.'],cta:'Have you ever held a losing investment because you believed an infrastructure timeline?',tags:'#DubaiRealEstate #Infrastructure #Corridor #Mistake #MRlivingcapital',source:'Personal portfolio records / RTA project updates',photo:'map',sowhat:'Buy the corridor as it is today. Future infrastructure is a free option, not the thesis.'},
{key:'lifestyle-2m',type:'jab',pillar:'Dubai Lifestyle',asof:'August 2026',engine:'Think Differently',title:'What AED 2 million actually buys you in Dubai.',accents:['AED 2 million','actually buys'],sub:'Not a sales pitch. A reality check. I looked at 14 transactions closed in July 2026 at exactly this ticket. Here is the honest breakdown.',subAccent:'honest breakdown',points:['Downtown: 1-bedroom, 750-850 sq ft, older building, AED 18-22/sq ft service charges. No parking.','Dubai Hills: 2-bedroom, 1,100 sq ft, mid-rise, pool view. Service charges AED 14/sq ft. One parking.','JVC: 2-bedroom + study, 1,350 sq ft, new build, two parking. Service charges AED 12/sq ft.','Business Bay: 1-bedroom loft, 900 sq ft, canal view, valet building. Service charges AED 20/sq ft.','The surprise: JVC gives you 50% more space for the same money. Trade-off: location premium and resale liquidity.'],cta:'If you had AED 2M to deploy today, which of these five would you pick — and why?',tags:'#DubaiRealEstate #DubaiLifestyle #Budget #Comparison #MRlivingcapital',source:'DLD July 2026 transaction data / service charge registers',photo:'interior',sowhat:'AED 2M forces a choice: location, space, or newness. You cannot have all three.'},
{key:'sig-wouldibuy',type:'hook',pillar:'The Strategist',asof:'August 2026',engine:'Masoud Has an Opinion',title:'Would I Buy It? Dubai Hills.',accents:['Would I Buy It?'],sub:'The verdict: MAYBE. But only if you are buying the right product type in the right cluster. Here is my 90-second underwriting.',subAccent:'MAYBE',points:['Dubai Hills has 8,000+ units delivered and another 3,000+ coming. Supply is concentrated, not scarce.','The mall and hospital are live. The metro is not. Car-dependency for 5+ years — factor it into rental appeal.','Villa values have held better than apartments because land is finite. Apartments face competition from new handovers.','Service charges are moderate (AED 12-15/sq ft) but rising 8% annually.','I would buy a 3-bed townhouse over a 2-bed apartment. Townhouse rental market is deeper.'],cta:'Do you underwrite Dubai Hills as one market, or separate villas from apartments?',tags:'#DubaiRealEstate #DubaiHills #WouldIBuyIt #SignatureSeries #MRlivingcapital',source:'DLD transaction data / rental comparables',photo:'meydan',sowhat:'Dubai Hills is not yes or no. It is "which product, which cluster, which entry price."'},
{key:'sig-redflag',type:'hook',pillar:'Advisory Warnings',asof:'August 2026',engine:'Think Differently',title:'Property Red Flag: No track record.',accents:['Red Flag'],sub:'New developer, fancy brochure, aggressive payment plan, and a sales team that talks about "vision" instead of "delivered projects." I have seen this movie.',subAccent:'seen this movie',points:['First-time developers have no delivery history to verify construction quality or timeline accuracy.','RERA registration is a licence to operate, not a quality seal. Any funded team can get one.','Aggressive payment plans — 1% per month, post-handover 5 years — often mean the developer needs your cash flow to fund construction.','No track record means no bank project financing. If banks will not lend, ask why you should.','Exception: new developer backed by sovereign fund or major contractor with 20+ years history.'],cta:'Would you buy from a developer with zero delivered projects if the payment plan looked amazing?',tags:'#DubaiRealEstate #RedFlag #Developer #DueDiligence #MRlivingcapital',source:'RERA developer registry / DLD project records',photo:'museum',sowhat:'A track record is proof that someone survived a full market cycle without losing buyer money.'},
{key:'office-surge',type:'hook',pillar:'Market Intelligence',asof:'August 2026',engine:'Market Detective',title:'Office rents just jumped 31.5% and nobody noticed.',accents:['31.5%','nobody noticed'],sub:'While everyone watches residential prices, the commercial market is tightening. Grade B vacancy is 6.1%. And the yield gap is widening.',subAccent:'widening',points:['Grade B office rents rose 31.5% in Q2 2026. Vacancy fell to 6.1% — tightest in 5 years.','40% of Grade B buildings are 15+ years old and need retrofit. That is supply destruction.','Yield spread between residential (5-6%) and commercial (7-9%) is widest since 2022.','New office supply 2027-2028 is 60% pre-leased. The market is not waiting for buildings to finish.','Investors are still buying residential off-plan while commercial ready stock offers immediate income at higher yields.'],cta:'Is your portfolio 100% residential because you understand it, or because you have never looked at the office numbers?',tags:'#DubaiRealEstate #Commercial #Office #Yield #MRlivingcapital',source:'CBRE Q2 2026 Dubai Office Market Report / DLD commercial data',photo:'businessbay',sowhat:'The office market is telling a story that residential buyers are ignoring. 31.5% rent growth is a shout.'},
{key:'h1-drop',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Think Differently',title:'Dubai sales fell 16% in H1 2026. The real story.',accents:['fell 16%','real story'],sub:'Headlines scream "slowdown." The full picture says: AED 225.7 billion still changed hands. That is 15% above H1 2024. Context matters.',subAccent:'Context matters',points:['H1 2026: AED 225.7B in sales, down 16% from record H1 2025. But up 15% from H1 2024.','Dip driven by geopolitical tension in early 2026, not weak fundamentals. Prices corrected 4-7% Feb-Apr and stabilized.','Average price per sq ft H1 2026: AED 1,900. H1 2024: AED 1,800. Still 5.5% higher over 24 months.','Buyer activity returned steadily after ceasefire efforts. Q2 momentum recovered faster than predicted.','One quarter of fear does not erase four years of structural demand. Dubai is not speculative anymore.'],cta:'Did the H1 headlines make you pause, or did you see the 15% gain over 2024 and keep moving?',tags:'#DubaiRealEstate #MarketData #H12026 #Trends #MRlivingcapital',source:'Anarock H1 2026 Dubai Residential Market Report',photo:'skyline',sowhat:'A 16% drop from a record high is normalization. The market is still larger than it was in 2024.'},
{key:'cash-abudhabi',type:'jab',pillar:'Investor Education',asof:'August 2026',engine:'Think Differently',title:'87% of Abu Dhabi buyers paid cash. Are you competing?',accents:['87%','cash'],sub:'This is not a flex. It is a market structure fact. When almost nine out of ten transactions need no bank approval, the buyer pool moves faster and negotiates harder.',subAccent:'moves faster',points:['Abu Dhabi recorded AED 142 billion in real estate transactions in 2025, up 44% YoY. 87% were cash.','Cash buyers close in 14-21 days. Mortgage buyers need 45-60 days. In a seller market, that gap costs you the deal.','Cash dominance means price discovery happens without credit friction. What you see is what the market values.','For foreign investors: cash competition is not going away. Dirham peg, zero income tax, Golden Visa keep capital flowing.','If you are mortgage-dependent, your edge is not speed. It is selectivity.'],cta:'Are you trying to outbid cash buyers on speed, or are you playing a different game entirely?',tags:'#AbuDhabiRealEstate #CashBuyers #MarketStructure #InvestorEducation #MRlivingcapital',source:'ADREC 2025 annual report / Engel & Voelkers Abu Dhabi analysis',photo:'reem',sowhat:'Cash is the baseline in Abu Dhabi. If you are not bringing cash, bring something else the seller values.'},
{key:'offplan-resale',type:'hook',pillar:'Advisory Warnings',asof:'August 2026',engine:'Market Detective',title:'Off-plan resale volume tripled. That is a warning.',accents:['tripled','warning'],sub:'In Abu Dhabi, off-plan resale jumped from 4% to 15% of all off-plan sales in one year. In Dubai, the same pattern is emerging. This is not liquidity. This is exit pressure.',subAccent:'exit pressure',points:['Off-plan resale means the original buyer is selling their contract before completion.','When resale volume triples, it signals original buyers are nervous about delivery or overleveraged.','Resale supply competes with developer primary sales — often at a discount. That caps price growth.','Buyers picking up resales often do not know the original SPA terms or escrow status.','If you see 20%+ resale listings before handover, ask why so many want out before seeing the finished product.'],cta:'Would you buy an off-plan resale without reading the original SPA? Most people do.',tags:'#DubaiRealEstate #AbuDhabi #OffPlan #Resale #AdvisoryWarnings #MRlivingcapital',source:'Savills Abu Dhabi Q1 2026 / DLD off-plan resale tracking',photo:'map',sowhat:'Off-plan resale volume is a canary in the coal mine. When it spikes, original buyers are voting with their exit buttons.'},
{key:'supply-wave',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Think Differently',title:'120,000 new Dubai units are coming. Here is the map.',accents:['120,000','Here is the map'],sub:'Moody\'s estimates 120,000 new homes in Dubai in 2026. That is not a crash signal. It is a relocation signal.',subAccent:'relocation signal',points:['Dubai South, Dubai Islands, and Al Furjan account for 45% of new supply. Not prime corridors.','Emaar and Damac are launching large-scale projects, but 70% are apartments under AED 1.5M entry. Mass market, not luxury.','Prime corridors — Downtown, Palm, Marina — have minimal new supply. Scarcity holds prices.','The 120,000 number includes delayed 2024-2025 projects. Real 2026 net new supply: 85,000-95,000.','Investor opportunity: buy scarcity in prime, not volume in fringe.'],cta:'Are you chasing volume in new launches, or scarcity in established corridors?',tags:'#DubaiRealEstate #Supply #NewUnits #MarketIntelligence #MRlivingcapital',source:'Moody\'s UAE Real Estate Outlook 2026 / DLD supply pipeline',photo:'south',sowhat:'120,000 units sounds scary until you map them. Most are in corridors you were not buying anyway.'},
{key:'opinion-ready',type:'hook',pillar:'The Strategist',asof:'August 2026',engine:'Masoud Has an Opinion',title:'Ready stock is the only safe play in Q3 2026.',accents:['only safe play'],sub:'Off-plan is not dead. But in a market with delivery delays, escrow anxiety, and price uncertainty, ready stock is the only place where you can verify before you buy.',subAccent:'verify before you buy',points:['Ready stock lets you inspect the actual unit, verify the view, measure the noise, and test the commute.','Off-plan relies on renders, promises, and a developer\'s track record — all subject to change.','In Q3 2026, ready stock in prime corridors trades at only 8-12% premium to comparable off-plan.','Rental income from day one offsets the premium. Off-plan pays nothing for 2-3 years.','Risk-adjusted return on ready stock is higher than off-plan when you factor in delivery risk and time value.'],cta:'Are you buying off-plan for the fantasy, or ready stock for the reality?',tags:'#DubaiRealEstate #ReadyStock #Q3 #Safety #MRlivingcapital',source:'DLD transaction data / rental register',photo:'interior',sowhat:'Ready stock is not boring. It is verified. In Q3 2026, verification is worth more than speculation.'},
{key:'think-yield',type:'jab',pillar:'Market Intelligence',asof:'August 2026',engine:'Think Differently',title:'Yield is not a number. It is a story about risk.',accents:['story about risk'],sub:'A 9% yield sounds better than 6%. Until you discover the 9% comes with a tenant who pays late, a building with rising service charges, and a lease that expires in 8 months.',subAccent:'story about risk',points:['Gross yield ignores vacancy, service charges, maintenance, and tenant quality.','Net yield is the only number that matters, and it is always 20-30% lower than gross.','A 6% net yield with a 5-year lease to a multinational is better than a 9% gross yield with an SME on a 1-year lease.','Yield compression happens when capital floods a corridor. Yield expansion happens when risk increases.','The best investors do not chase yield. They chase yield stability.'],cta:'Do you know the net yield of your last purchase, or are you still quoting the gross number from the brochure?',tags:'#DubaiRealEstate #Yield #Risk #MarketIntelligence #MRlivingcapital',source:'Personal underwriting framework / DLD rental data',photo:'businessbay',sowhat:'Yield is a story about risk, not a number. Gross yield is fiction. Net yield with tenant quality is the only truth.'},
{key:'direct-rak',type:'jab',pillar:'Direct Business',asof:'August 2026',engine:'Direct Business',title:'RAK: the last corridor with 2024 pricing.',accents:['2024 pricing'],sub:'Wynn is coming. The airport is expanding. The free zone is growing. But the land is still priced like 2024. That gap is the opportunity.',subAccent:'gap is the opportunity',points:['RAK land prices are 35-40% below comparable Dubai corridors.','Wynn Al Marjan opening September 2027 will bring 4,000+ hospitality jobs and 1.5M annual visitors.','RAK free zone company registrations grew 28% in 2025 — fastest of any UAE emirate.','Entry ticket for RAK residential: AED 600K-1.2M — accessible to first-time investors and Golden Visa seekers.','The risk is liquidity. RAK resale volumes are 60% lower than Dubai. This is buy-and-hold, not a flip.'],cta:'Are you buying RAK for the 2024 pricing, or for the Wynn headline? The pricing is the real edge.',tags:'#DubaiRealEstate #RAK #Wynn #DirectBusiness #MRlivingcapital',source:'RAK Real Estate data / Wynn investor filings',photo:'wynn',sowhat:'RAK is the last corridor with 2024 pricing. The Wynn effect is coming. The gap between now and 2027 is the window.'},
{key:'story-client',type:'jab',pillar:'Behind the Deal',asof:'August 2026',engine:'Real Investor Stories',title:'The client who bought three units in one afternoon.',accents:['three units','one afternoon'],sub:'He did not come to buy three. He came to buy one. But he had done his homework, and when he saw the numbers, he acted.',subAccent:'difference between investors and shoppers',points:['The client had spent 6 months researching corridors, comparing yields, and visiting buildings.','He came to see one unit. I showed him two more in the same building priced 5-8% below market.','He underwrote all three in 20 minutes: gross yield, net yield after service charges, and 3-year cash flow.','He bought all three because the portfolio effect reduced vacancy risk and increased negotiation leverage.','The lesson: when you know your numbers, decisions are fast. When you do not, every purchase is a gamble.'],cta:'How long do you spend researching before you buy? Or do you decide in the sales centre?',tags:'#DubaiRealEstate #Portfolio #BehindTheDeal #InvestorEducation #MRlivingcapital',source:'Client advisory record / transaction data',photo:'interior',sowhat:'The client who bought three units in one afternoon had spent six months preparing. Speed is a byproduct of preparation.'}
];
const FA={
'ad-rush':{title:'ابوظبی برای دهه‌ها سرمایه‌گذاری می‌کند، نه سال‌ها.',hook:'موج سرمایهٔ حاکمیتی یه تیتر نیست. تخصیص ساختاریه. مُدُن، جزیرهٔ ریم، و ADGM پروژه نیستن — دهه‌ها جریان نقدی‌ان که توی پنجره‌های لانچ فشرده شدن.',points:['سرمایهٔ دولتی ابوظبی داره توی املاک با مقیاسی وارد می‌شه که سرمایهٔ خصوصی کنارش رقم گرد شده به نظر می‌رسه.','مُدُن یه سازنده نیست. یه وسیلهٔ تخصیص سرمایه با حکم ۳۰ ساله‌ست.','جزیرهٔ ریم داره تبدیل می‌شه به پلان بی منطقهٔ مالی — نه صحنهٔ اصلی، ولی جایی که پول واقعی می‌شینه.','چارچوب مجوز و نظارت ADGM داره صندوق‌های پوشش ریسک، دفترهای خانوادگی، و فین‌تک رو از دبی می‌کشه.','بلیت ورود برای مواجههٔ جدی داره بالا میره. پنجرهٔ مشارکت خرده‌فروشی داره بسته می‌شه.'],cta:'ابوظبی رو به عنوان بازی متنوع‌سازی نگاه می‌کنی، یا هنوز بهش به چشم همسایهٔ کوچیک‌تر دبی نگاه می‌کنی؟',tags:'#املاک_دبی #ابوظبی #تجاری #سرمایه‌گذاری #ام_آر_لیوینگ_کپیتال'},
'uk-exodus':{title:'۱۶۵۰۰ میلیونر امسال انگلستان رو ترک کردن.',hook:'این مهاجرت نیست. این تخلیهٔ سرمایه‌ست. و امارات دوباره کریدور دریافت اصلیه. ولی دریافتشون با گرفتن سرمایه‌شون فرق داره.',points:['دادهٔ هنلی: ۱۶۵۰۰ میلیونر انگلیسی توی ۲۰۲۵-۲۰۲۶ خارج شدن، بالاتر از ۹۵۰۰ سال قبل.','امارات برای سومین سال متوالی بیشترین سهم از این جریان سرمایه رو گرفته.','اینا توریست املاک نیستن. دفترهای خانوادگی، مدیران صندوق پوشش ریسک، و بنیان‌گذاران تکنولوژی‌ان.','اونا آپارتمان‌های پیش‌فروش نمی‌خرن. اونا املاک تجاری آزاد، مسکنی حجمی، و زمین توسعه می‌خرن.','فرصت این نیست که بهشون یه واحد بفروشی. فرصت اینه که شریک محلی بشی.'],cta:'سعی می‌کنی به میلیونرا ملک بفروشی، یا سعی می‌کنی مشاوری بشی که قبل از خرید بهش زنگ می‌زنن؟',tags:'#املاک_دبی #انگلستان #میلیونر #جریان_سرمایه #ام_آر_لیوینگ_کپیتال'},
'gold-line':{title:'دبی یه خط طلایی از ۵۵ پروژهٔ بزرگ رد کرد.',hook:'۳۴ میلیارد درهم. ۴۲ کیلومتر. کاملاً زیرزمینی. این تمدید مترو نیست. این نقشهٔ جابجایی سرمایه‌ست.',points:['خط طلایی دبی اینوستمنت پارک رو به الممزر از طریق ۱۴ ایستگاه وصل می‌کنه، ۱۱ تاشون قطب تبادلی‌ان.','۵۵ پروژهٔ عظیم الان توی شعاع ۸۰۰ متری ایستگاه خط طلایی‌ان.','ساخت زیرزمینی یعنی هیچ اختلال سطحی توی ساخت نیست، ولی هزینهٔ بالاتر — ۸۱۰ میلیون درهم به ازای هر کیلومتر.','۶۰٪ خط از ابزارهای حاکمیتی دبی و ۴۰٪ از اوراق قرضهٔ زیرساختی خصوصی تأمین می‌شه.','هدف تکمیل ۲۰۳۲ه. منحنی افزایش ارزش زمین از الان شروع می‌شه.'],cta:'نزدیک ایستگاه خط طلایی می‌خری برای تکمیل ۲۰۳۲، یا کریدوری که بهش تغذیه می‌کنه رو می‌خری؟',tags:'#املاک_دبی #خط_طلایی #زیرساخت #اطلاعات_بازار #ام_آر_لیوینگ_کپیتال'},
'wynn-date':{title:'وینن تاریخش رو قفل کرد. سپتامبر ۲۰۲۷.',hook:'تنها استراحتگاه یکپارچهٔ بازی توی امارات از "برنامه‌ریزی‌شده" رفت به "قطعی." این خبر مهمان‌پذیری نیست. این رویداد ارزش زمین راس‌الخیمه با ددلاین سخت‌ست.',points:['وینن آل مارجان: ۵.۷ میلیارد دلار، ۱۵۰۰ اتاق، یکپارچه با بازی — تنها مجوز از نوع خودش توی امارات.','سپتامبر ۲۰۲۷ الان تاریخ افتتاحیهٔ قطعیه، پشتوانهٔ پیشرفت ساخت و اوراق پیمانکار.','معاملات املاک راس‌الخیمه توی Q2 ۲۰۲۶، ۳۴٪ جهش کرده.','کریدور هنوز توی خیلی جاها قیمت ۲۰۲۴ داره — شکافی که با نزدیک شدن افتتاحیه بسته می‌شه.','پول باهوش استراحتگاه رو نمی‌خره. پول باهوش کریدور خدماتی و مسکن کارکنان رو می‌خره.'],cta:'زمین نزدیک وینن رو برای کازینو می‌خری، یا برای ۴۰۰۰ کارمندی که نیاز به مسکن دارن؟',tags:'#املاک_دبی #راس_الخیمه #وینن #بازی #ام_آر_لیوینگ_کپیتال'},
'modon-reem':{title:'مُدُن داره ریم رو می‌چینه.',hook:'۱۱.۹۷ میلیارد درهم توی یه فصل. این لانچ نیست. این بیانیهٔ حاکمیتیه. و ریسک-سود رو برای هر سرمایه‌گذار خصوصی توی کریدور عوض می‌کنه.',points:['مُدُن پراپرتیز — پشتوانهٔ حاکمیتی ابوظبی — توی Q2 ۲۰۲۶ فقط توی ریم ۱۱.۹۷ میلیارد درهم فروش ثبت کرد.','مقیاس تخصیص سرمایه سازنده‌های خصوصی رو شبیه بازیچه می‌کنه.','مُدُن روی قیمت رقابت نمی‌کنه. روی اطمینان رقابت می‌کنه — پشتوانهٔ حاکمیتی یعنی ریسک تحویل صفر.','سرمایه‌گذارای خصوصی توی ریم الان یه انتخاب دارن: روی محصول با مُدُن رقابت کنن، یا روی موج زیرساختی که مُدُن داره درست می‌کنه سوار بشن.','بازی واقعی خریدن واحد مُدُن نیست. خریدن مجاورت‌ها — تجاری، دفتر، و مهمان‌پذیری.'],cta:'با مُدُن رقابت می‌کنی، یا خودت رو برای سرویس دادن به اکوسیستمی که مُدُن داره می‌سازه آماده می‌کنی؟',tags:'#املاک_دبی #ابوظبی #مُدُن #ریم #ام_آر_لیوینگ_کپیتال'},
'p26':{title:'سازنده‌ها لانچ کردن رو متوقف کردن.',hook:'چون زمینشون تموم نشده. چون خریدارایی که حاضرن قیمت ۲۰۲۵ رو توی بازار ۲۰۲۶ بدن تموم شدن. خط لانچ یه شاخص پیشروست.',points:['Q2 ۲۰۲۶، ۴۷٪ لانچ پروژهٔ جدید کمتر از Q2 ۲۰۲۵.','میانگین قیمت لانش هر فوت مربع از Q1 به Q2 ۲۰۲۶، ۸٪ افتاد.','سازنده‌ها داره زمین بانک رو نگه می‌دارن و منتظر بازیابی قیمت‌ان.','این کمبود عرضه نیست. ناسازگاری تقاضا-قیمته.','وقتی لانچ‌ها برمی‌گردن، احتمالاً با نقطهٔ قیمت پایین‌تر برمی‌گردن.'],cta:'منتظر موج لانچ بعدی هستی، یا واسط آماده می‌خری در حالی که سازنده‌ها فریز شدن؟',tags:'#املاک_دبی #سازنده #لانچ #اطلاعات_بازار #ام_آر_لیوینگ_کپیتال'},
'p27':{title:'دفترها سه برابر شدن.',hook:'نه توی قیمت. توی سرعت اجاره. بازار تجاری داره سفت می‌شه در حالی که مسکنی هنوز داره بحث می‌کنه.',points:['اجارهٔ دفتر گرید A توی DIFC و بیزینس بی ۲۲٪ رشد سالانه داشته.','نرخ جای خالی توی تجاری Prime برای اولین بار از ۲۰۱۹ زیر ۸٪ رفته.','تغییر به کار ترکیبی دفتر رو نکشت. تکه‌تکه‌اش کرد.','سود تجاری (۷-۹٪) الان به طور قابل‌توجهی از سود ناخالص مسکنی (۵-۶٪) بالاتره.','مانع ورود بالاتره — تجاری سرمایهٔ بیشتر و احتیاط بیشتر می‌خواد.'],cta:'سبدت ۱۰۰٪ مسکنیه چون می‌فهمیش، یا چون هرگز به اعداد دفتر نگاه نکردی؟',tags:'#املاک_دبی #تجاری #دفتر #سود #ام_آر_لیوینگ_کپیتال'},
'p28':{title:'قیمت‌ها دو ماه افتاد.',hook:'فوریه تا آوریل ۲۰۲۶. اصلاح ۴-۷٪. سقوط نبود. یه نفس. و اکثر خریدارا وحشت کردن در حالی که پول باهوش مستقر شد.',points:['میانگین قیمت هر فوت مربع از ۱۹۸۰ درهم توی فوریه به ۱۸۴۰ توی آوریل ۲۰۲۶ افتاد.','افتادگی از تنش ژئوپلیتیکی بود، نه بنیاد ضعیف.','حجم معاملات توی دورهٔ افتادگی بالا رفت — ۱۲٪ معاملهٔ بیشتر توی آوریل نسبت به مارس.','خریدارای نقدی توی دورهٔ افتادگی غالب بودن، ۷۸٪ معاملات.','بازار توی ژوئن ۲۰۲۶ به ۱۹۰۰+ برگشت. افتادگی یه پنجرهٔ ۶۰ روزه بود.'],cta:'توی افتادگی فریز شدی، یا بهش به چشم یه پنجرهٔ ۶۰ روزه برای مستقر شدن نگاه کردی؟',tags:'#املاک_دبی #اصلاح_قیمت #افتادگی #هشدار #ام_آر_لیوینگ_کپیتال'},
'p29':{title:'دبی ساوت شهر رو رهبری کرد.',hook:'نه توی قیمت. توی حجم معامله. کریدور مقرون‌به‌صرفه‌ترین همون فعال‌ترینه.',points:['دبی ساوت توی هفتهٔ ۲۰ ژوئیه، ۲۸۴۷ معامله ثبت کرد — بیشتر از هر کریدوری.','میانگین بلیت ۱.۲ میلیون بود، ۴۰٪ پایین‌تر از میانگین شهر.','۶۰٪ خریدارا سرمایه‌گذار اولیه بودن، نه کاربر نهایی.','جاذبه قیمت وروده، نه پرمیوم موقعیت.','دبی ساوت داره تقاضایی رو جذب می‌کنه که دیگه نمی‌تونه JVC یا الفرجان رو بخره.'],cta:'دبی ساوت رو چون به کریدور اعتماد داری می‌خری، یا چون فقط اونجاست که بودجه‌ت هنوز کار می‌کنه؟',tags:'#املاک_دبی #دبی_ساوت #حجم #اطلاعات_بازار #ام_آر_لیوینگ_کپیتال'},
'p30':{title:'۱۵.۶ میلیارد درهم توی "مرده" ژوئیه.',hook:'ژوئیه قراره آروم باشه. رمضان تموم شده. تابستونه. همه تعطیلاتن. به جز ثبت معاملات.',points:['۱۵.۶ میلیارد درهم معامله توی هفتهٔ ۶-۱۰ ژوئیه ۲۰۲۶.','۲۳٪ بالاتر از همون هفته توی ۲۰۲۵.','روایت "کندی تابستان" قدیمیه. املاک دبی دیگه برای گرما وایسا نمی‌کنه.','خریدارای نقدی از مستقر شدن سرمایه توی تابستونه تعطیل نمی‌کنن.','درس: زمان‌بندی بازار بر اساس فصلیت اشتباه سرمایه‌گذار خرده‌ست.'],cta:'هنوز به کندی تابستانه اعتقاد داری، یا متوجه شدی سرمایه تعطیلات نمی‌گیره؟',tags:'#املاک_دبی #ژوئیه #فصلیت #اطلاعات_بازار #ام_آر_لیوینگ_کپیتال'},
'p31':{title:'آماده پیش‌فروش رو شکست داد.',hook:'توی H1 ۲۰۲۶، املاک آماده از پیش‌فروش هم توی سود و هم توی حفظ سرمایه بهتر عمل کرد. روایت داره عوض می‌شه.',points:['املاک آماده سود ناخالص ۶.۲٪ دادن در مقابل ۴.۸٪ پیش‌فروش.','رشد قیمت پیش‌فروش به ۳٪ سالانه کند شده در مقابل ۸٪ برای آماده.','ریسک تحویل، اضطراب اسکرو، و خستگی طرح پرداخت داره سرمایهٔ جدی رو به سمت آماده هل می‌ده.','پرمیوم آماده به ۸-۱۲٪ فشرده شده.','پول باهوش آماده می‌خره، فوراً اجاره می‌ده، و از درآمد برای خرید بعدی استفاده می‌کنه.'],cta:'هنوز پیش‌فروش می‌خری برای "سود آینده" در حالی که آماده امروز بهت پول می‌ده؟',tags:'#املاک_دبی #آماده #پیش_فروش #سود #آموزش #ام_آر_لیوینگ_کپیتال'},
'p32':{title:'سود واقعی کجاست.',hook:'نه توی پیش‌فروش مسکنی. نه توی آپارتمان لوکس. توی موجودی تجاری آماده با مستأجرای موجود.',points:['موجودی تجاری آماده توی بیزینس بی و DIFC سود خالص ۷.۵-۹.۲٪ می‌ده.','موجودی مسکنی آماده توی همون کریدورها سود ناخالص ۵.۲-۶.۱٪ می‌ده.','شکاف سود راز نیست. یه مانع سرمایه‌ست.','واحدهای دفتر زیر ۱۰۰۰ فوت نقطهٔ شیرین‌ان.','ریسک جای خالی نیست. کیفیت مستأجره.'],cta:'دنبال سود مسکنی می‌گردی چون آشناست، یا چون هرگز یه اجاره‌نامهٔ تجاری رو آنالیز نکردی؟',tags:'#املاک_دبی #تجاری #دفتر #سود #آماده #ام_آر_لیوینگ_کپیتال'},
'p33':{title:'چرا به استرادا پیوستم.',hook:'نه برای تقسیم کمیسیون. نه برای برند. برای یه چیز که مهمه: دسترسی به موجودی پیش‌فروش قبل از اینکه به بازار برسه.',points:['استرادا یه آژانس سنتی نیست. یه متخصص پیش‌فروش با رابطهٔ مستقیم سازنده‌ست.','اکثر سرمایه‌گذارا لانچ رو توی اینستاگرام می‌بینن. مشتریای استرادا ۳۰ روز قبل نقشهٔ طبقه رو می‌بینن.','تفاوت بین دسترسی زودهنگام و لانچ عمومی ۸-۱۵٪ مزیت قیمته.','من نپیوستم برای بیشتر فروختن. پیوستم برای بهتر خریدن برای مشتریام.','وقتی مشتریام دسترسی زودهنگام می‌گیرن، واحد بهتر می‌گیرن. وقتی واحد بهتر می‌گیرن، برمی‌گردن.'],cta:'پیش‌فروش رو از لانچ‌های عمومی می‌خری، یا pipeline داری که قبل از بازار موجودی رو می‌بینه؟',tags:'#املاک_دبی #استرادا #پیش_فروش #دسترسی #ام_آر_لیوینگ_کپیتال'},
'p34':{title:'کمبود دفتر تا ۲۰۲۸.',hook:'خط تحویل با تقاضا همگام نیست. و عرضهٔ جدید داره میاد ۶۰٪ پیش‌اجاره قبل از تکمیل.',points:['موجودی دفتر دبی سالانه ۳٪ رشد می‌کنه. تقاضا ۶٪.','کمبود توی گرید A و فضای دفتر انعطاف‌پذیر متمرکزه. گرید B مازاد داره.','ساختمان‌های دفتر جدیدی که توی ۲۰۲۶ لانچ می‌شن ۶۰٪ پیش‌اجاره‌ان.','فرصت توی برج‌های گرید A جدید نیست. توی بازسازی موجودی قدیمی گرید B به استاندارد انعطاف‌پذیره.','سرمایه‌گذارایی که ترکیب مستأجر و ساختار اجاره رو می‌فهمن سود رو می‌گیرن.'],cta:'عرضهٔ دفتر رو به عنوان یه بازار نگاه می‌کنی، یا گرید A رو از گرید B جدا می‌کنی؟',tags:'#املاک_دبی #تجاری #دفتر #عرضه #ام_آر_لیوینگ_کپیتال'},
'p35':{title:'فروش کامل هنوز اتفاق می‌افته.',hook:'توی بازاری که لانچ‌ها ۴۷٪ کمتر شدن، پروژه‌هایی که توی ۴۸ ساعت فروش کامل می‌شن تصادف نیستن. سیگنال‌ان.',points:['سه پروژه توی ۴۸ ساعت اول لانچ توی Q2 ۲۰۲۶ فروش کامل شدن.','هر سه توی کریدورهای Prime بودن: داون‌تاون، دبی هیلز، و پالم جمیرا.','هر سه با ۱۵-۲۰٪ پرمیوم نسبت به آمادهٔ مشابه قیمت‌گذاری شده بودن.','خریدارا کاربر نهایی نبودن. دفترهای خانوادگی و سرمایهٔ حاکمیت‌محور بودن.','فروش کامل توی بازار کند جایی رو نشون می‌ده که پول باهوش حاضره پرمیوم بده.'],cta:'دنبال پروژه‌های فروش کامل می‌گردی چون داغن، یا آنالیز می‌کنی فروش کامل دربارهٔ جریان سرمایه چی می‌گه؟',tags:'#املاک_دبی #فروش_کامل #Prime #اطلاعات_بازار #ام_آر_لیوینگ_کپیتال'},
'p36':{title:'چطور یه لانچ رو بخونی.',hook:'اکثر سرمایه‌گذارا بروشور رو می‌خونن. من اسکرو، طرح پرداخت، سه پروژهٔ قبلی سازنده، و آمادهٔ مشابه رو می‌خونم.',points:['درصد پر بودن اسکرو رو چک کن. هر چیزی زیر ۸۰٪ توی لانچ پرچم قرمزه.','طرح پرداخت رو روی پیشرفت ساخت نقشه بکش. طرح‌های front-loaded به نفع سازنده‌ان.','سه پروژهٔ تحویل دادهٔ قبلی سازنده رو بررسی کن. میانگین تأخیر، تأخیر مورد انتظار توئه.','قیمت لانچ رو با آمادهٔ همون کریدور مقایسه کن. پرمیوم ۳۰٪ به ۳۰٪ توجیه نیاز داره.','ترکیب واحد رو چک کن. اگه ۷۰٪ استودیو و یک‌خوابه‌ان، ساختمان برای سرمایه‌گذار طراحی شده.'],cta:'چک‌لیست لانچ داری، یا بر اساس رندر و تیتر طرح پرداخت می‌خری؟',tags:'#املاک_دبی #لانچ #احتیاط #آموزش #ام_آر_لیوینگ_کپیتال'},
'p37':{title:'قوانین گلدن ویزا ۲۰۲۶.',hook:'آستانه هنوز ۲ میلیونه. ولی اجرا سفت‌تر شده. و نرخ رد برای درخواست‌هایی که استانداردهای جدید رو ندارن داره میره بالا.',points:['سرمایه‌گذاری ۲ میلیون درهمی املاک هنوز برای گلدن ویزای ۱۰ ساله صلاحیت داره.','قوانین جدید ۲۰۲۶ می‌خوان ملک کاملاً پرداخت شده باشه — املاک وام‌دار دیگه صلاحیت ندارن مگر ۵۰٪+ سهام ثابت بشه.','املاک پیش‌فروش الان به ۵۰٪ تکمیل پرداخت و عقد معتبر نیاز دارن.','مالکیت مشترک: هر مالک باید به طور فردی ۲ میلیون سرمایه‌گذاری کنه.','زمان پردازش به ۱۵-۲۰ روز کاری افزایش پیدا کرده.'],cta:'درخواست گلدن ویزات بر اساس فرضیات ۲۰۲۵ه، یا برای نیازمندی‌های ۲۰۲۶ به‌روز شدی؟',tags:'#املاک_دبی #گلدن_ویزا #امارات #آموزش #ام_آر_لیوینگ_کپیتال'},
'story-nearmiss':{title:'ملکی که تقریباً خریدم.',hook:'ببین، یه چیزی رو خیلی رک بهت بگم. همون ملکی که عالی به نظر می‌رسید، یه عیب کشنده داشت که تو عکس‌ها معلوم نبود.',points:['طراحی طبقه مشکل داشت: اتاق دوم هیچ نوری نداشت. عکاس‌ها این زاویه رو نشون نمیدن.','شارژ سرویس ۱۸٪ بیشتر از تبلیغ بود — پنهان شده توی ضمیمهٔ قرارداد، نه صفحهٔ اول.','سازنده دو پروژهٔ قبلی رو به طور میانگین ۱۴ ماه دیر تحویل داده بود. من از RERA چک کردم، نه گوگل.','منظرهٔ "باغ" در واقع محل تخلیهٔ بار برای طبقهٔ تجاری بود. فیلم پهپادی حقیقت رو فاش کرد.','شش ماه بعد، دو خیابون اونورتر با ۸٪ قیمت کمتر و ۲۲٪ شارژ سرویس پایین‌تر خریدم.'],cta:'تا حالا از معامله‌ای که عالی به نظر می‌رسید کنار کشیدی؟ چه نشونه‌ای باعث شد بری؟',tags:'#املاک_دبی #سرمایه‌گذاری #آموزش #پشت_معامله #ام_آر_لیوینگ_کپیتال'},
'story-walkaway':{title:'چرا از معاملهٔ ۲۰ میلیون درهمی رد شدم.',hook:'اعداد درست کار می‌کردن. سازنده معتبر بود. کریدور درست بود. ولی یه بند توی قرارداد اسکرو باعث شد لپ‌تاپ رو ببندم و به وکیلم زنگ بزنم.',points:['برنامهٔ آزادسازی اسکرو ۷۰٪ پیش‌پرداخت قبل از ۴۰٪ پیشرفت ساخت بود.','سازنده حق داشت از پول اسکرو برای "زیرساخت بازاریابی و فروش" استفاده کنه — نه فقط ساخت.','پروژه‌های مشابه همین سازنده به طور میانگین ۱۸ ماه دیرتر از وعده تحویل شده بودن.','طرح پرداخت پس از تحویل ۳ ساله بود، ولی SPA اجازه می‌داد سازنده در صورت توقف ۹۰ روزهٔ ساخت، کل مبلغ رو طلب کنه.','به مشاورم گفتم: "این مشکل ملک نیست. این مشکل ساختار سرمایه‌ست."'],cta:'اگه یه بند بد توی قرارداد باشه، معامله رو می‌کشی یا سعی می‌کنی مذاکره کنی؟',tags:'#املاک_دبی #پیش_فروش #احتیاط #پشت_معامله #ام_آر_لیوینگ_کپیتال'},
'story-negotiation':{title:'مذاکره‌ای که همه‌چیز رو بهم یاد داد.',hook:'فکر می‌کردم قیمت ثابته. فروشنده فکر می‌کرد من مستأصلم. هر دومون اشتباه می‌کردیم.',points:['قیمت فهرست ۲.۴ میلیون بود. من ۲.۱۵ پیشنهاد دادم با بستن ۱۴ روزه. فروشنده خندید.','فهمیدم فروشنده قبلاً ملک بعدی رو خریده و قبل از رمضان نیاز به انتقال داره.','قیمت رو پایین نیاوردم. بستن رو به ۷ روز کوتاه کردم و گفتم پیگیری NOC رو خودم انجام میدم.','۲.۱۸ میلیون پذیرفت — ۲۲۰ هزار زیر قیمت فهرست — چون سرعت براش از قیمت ارزشمندتر بود.','درس: قیمت فقط یه ارزه. زمان، اطمینان، و کم‌کردن دردسر ارزهای دیگه‌ان.'],cta:'توی مذاکره فقط سر قیمت چونه می‌زنی، یا می‌فهمی طرف مقابل واقعاً چی می‌خواد؟',tags:'#املاک_دبی #مذاکره #بازار_ثانویه #پشت_معامله #ام_آر_لیوینگ_کپیتال'},
'story-firstcommercial':{title:'چطور اولین معاملهٔ تجاری‌ام رو آنالیز کردم.',hook:'سود ناخالص ۸.۲٪ بود. ولی بعد از شارژ سرویس، تجهیز، و جای خالی، سود خالص ۵.۱٪ شد. تجاری با مسکنی فرق داره.',points:['سود ناخالص ۸.۲٪ بود. سود خالص بعد از شارژ سرویس، تجهیز، و جای خالی ۵.۱٪.','مستأجر بند فسخ سال سوم داشت. من جریان نقدی رو با ۶ ماه جای خالی محاسبه کردم.','ساختمان ۳۴٪ جای پارکینگ داشت. استاندارد بازار ۵۰٪. این کیفیت مستأجر رو محدود می‌کنه.','به جای افزایش ۵٪ سالانهٔ اجاره، یخ‌زدگی ۳ ساله مذاکره کردم — چون نگه داشتن مستأجر از سود تئوریکی مهم‌تره.','معامله بسته شد. مستأجر ۱۸ ماهه هنوز اونجاست. "سود کمتر" الان از گزینهٔ دیگه بالاتره.'],cta:'آیا معاملات تجاری رو با منطق مسکنی آنالیز می‌کنی؟ چه معیاری رو از قلم انداختی؟',tags:'#املاک_دبی #تجاری #سود #پشت_معامله #ام_آر_لیوینگ_کپیتال'},
'opinion-jvc':{title:'الان توی JVC نمی‌خرم.',hook:'JVC بد نیست. ولی موج عرضهٔ ۲۰۲۶-۲۰۲۷ داره منطق ۲۰۲۳ رو خراب می‌کنه. دارن دیروز رو به قیمت امروز می‌فروشن.',points:['JVC توی ۲۰۲۴-۲۰۲۵ هشت هزار واحد تحویل داد. چهار هزار واحد دیگه ۲۰۲۶-۲۰۲۷ میاد.','رشد اجاره JVC به ۳٪ سالانه رسیده — پایین از ۱۲٪ توی ۲۰۲۳. عرضه داره تقاضا رو می‌بلعه.','نقطهٔ ورود "اقتصادی" دیگه منحصر به فرد نیست. الفرجان، دبی ساوت، و تاون اسکویر همین قیمت رو دارن.','شارژ سرویس توی خوشه‌های جدیدتر JVC سریع‌تر از اجاره داره میره بالا — سود خالص رو فشار میاره.','JVC بد نیست. ولی نسبت ریسک-سود عوض شده. اکثر خریدارا دارن دیروز رو قیمت‌گذاری می‌کنن.'],cta:'هنوز JVC رو با منطق ۲۰۲۳ می‌خری، یا برای عرضهٔ ۲۰۲۶ دوباره حساب کردی؟',tags:'#املاک_دبی #JVC #عرضه #ریسک #ام_آر_لیوینگ_کپیتال'},
'opinion-mortgage':{title:'خریدارای وام‌گرفته دارن خریدارای نقدی رو یارانه می‌دن.',hook:'این تئوری توطئه نیست. واقعیت ساختاری بازاره. اگه نقدی می‌خری، باید بفهمی اون یکی طرف داره چیکار می‌کنه برات.',points:['طرح‌های پیش‌فروش عملاً leverage بدون بهره برای سازنده‌ان. سازنده امروز پولتو می‌گیره، سه سال دیگه تحویل میده.','خریدارای نقدی اولویت تخصیص، تخفیف حجمی، و انتخاب بهتر دارن — چون سریع‌تر بسته می‌شه.','خریدارای وام ۲-۳٪ کارمزد بانک، ۴٪ DLD، و هزینهٔ ارزش‌گذاری می‌دن — ۶-۸٪ اضافه قبل از هر سودی.','وقتی قیمت ۴-۷٪ می‌افته، خریدار وام زیر آب میره. خریدار نقدی فقط کم‌پول‌تر می‌شه.','بازار نقدی رو پاداش میده. وام ابزاره، ولی توی این سیکل ابزار گرونیه.'],cta:'نقدی می‌خری چون باهوشی، یا چون راه دیگه‌ای نداری؟ فرقش مهم نیست؟',tags:'#املاک_دبی #وام #خریدار_نقدی #بازار #ام_آر_لیوینگ_کپیتال'},
'opinion-dubaisouth':{title:'دبی ساوت برای همه نیست.',hook:'اگه کاربر نهایی هستی و نزدیک اکسپو کار می‌کنی، شاید عالی باشه. ولی اگه سرمایه‌گذاری با امید سود ۲۰۲۱ می‌خری، داری نقشهٔ اشتباه می‌خری.',points:['دبی ساوت ۴۵ هزار واحد توی خط تحویل ۲۰۲۸ داره. این کمیابی نیست، این آزمایشگاه عرضه‌ست.','اثر اکسپو برای ترافیک پا واقعیه. برای رشد سرمایهٔ مسکنی هنوز واقعی نیست.','مترو به خوشه‌های مسکنی تا ۲۰۲۸ وصل نمی‌شه. وابستگی به ماشین تقاضای اجاره رو محدود می‌کنه.','سود روی کاغذ جذابه چون قیمت ورود پایینه. ولی دورهٔ جای خالی ۲۰-۳۰٪ از کریدورهای ثابت بیشتره.','دبی ساوت رو برای خودم زودتر از درآمد اجاره‌ای می‌خرم. این تقسیم صادقانه‌ست.'],cta:'دبی ساوت رو برای امروز می‌خری، یا برای جایی که امیدواری ۲۰۳۰ باشه؟',tags:'#املاک_دبی #دبی_ساوت #اکسپو_سیتی #آموزش #ام_آر_لیوینگ_کپیتال'},
'warning-escrow':{title:'تلهٔ طرح پرداخت پیش‌فروش.',hook:'"فقط ۲۰٪ موقع عقد." عالی به نظر می‌رسه. تا اینکه می‌فهمی ۵۰٪ بعدی قبل از نصف شدن ساختمان باید پرداخت بشه. این طرح پرداخت نیست، استخراج سرمایه‌ست.',points:['میانگین طرح پرداخت پیش‌فروش الان ۶۰-۷۰٪ کل قیمت رو قبل از ۵۰٪ پیشرفت ساخت می‌خواد.','اگه سازنده تأخیر داشته باشه، پولت توی اسکرو قفله که ممکنه تعهدات بازپرداخت کامل رو پوشش نده.','طرح‌های پس از تحویل ایمن به نظر می‌رسن، ولی خیلی‌هاشون قبل از انتقال سند، تسویهٔ کامل SPA رو می‌خوان.','بعضی سازنده‌ها از "پیشرفت ساخت‌محور" استفاده می‌کنن که مراحل اول رو پرپول می‌کنه و تأسیسات رو عقب میندازه.','ساختار ایمن: ۵۰٪ موقع تحویل، ۵۰٪ پس از تحویل طی ۲-۳ سال، با انتقال سند بعد از ۵۰٪ پرداخت.'],cta:'برنامهٔ زمان‌بندی پرداخت رو خوندی، یا فقط "۲۰٪ موقع عقد" رو دیدی؟',tags:'#املاک_دبی #پیش_فروش #اسکرو #هشدار #ام_آر_لیوینگ_کپیتال'},
'warning-guaranteed':{title:'چرا "سود تضمینی" پرچم قرمزه.',hook:'اگه سازنده ۸٪ سود رو برای ۳ سال تضمین می‌کنه، یه سوال بپرس: وقتی اجارهٔ واقعی ۵٪ه، فرقش رو کی پرداخت می‌کنه؟',points:['طرح‌های سود تضمینی بیمه نیستن. یارانهٔ بازاریابی‌ان که توی قیمت واحد پنهان شده.','"تضمین" معمولاً از صندوقی پرداخت می‌شه که با ۵-۱۰٪ گران‌فروشی واحد شارژ شده.','بعد از دورهٔ تضمین، صاحب ملکی هستی که ۱۵٪ بالاتر از بازار خریدی، بدون یارانه.','RERA دبی صراحتاً تبلیغ سود تضمینی رو نمی‌پسنده. اگه می‌بینی، سازنده داره قانون رو خم می‌کنه.','پول باهوش سود تضمینی نمی‌خواد. پول باهوش سود شفاف بر اساس اجارهٔ واقعی می‌خواد.'],cta:'۱۰٪ گران‌تر می‌خری فقط برای اینکه پول خودت رو به عنوان "اجارهٔ تضمینی" پس بگیری؟',tags:'#املاک_دبی #سود #پرچم_قرمز #هشدار #ام_آر_لیوینگ_کپیتال'},
'mistake-escrow':{title:'پیش‌فروش خریدم بدون اینکه اسکرو رو چک کنم.',hook:'سال ۲۰۱۹ بود. سازنده "معتبر" بود. پروژه "رو به راه." اسکرو ۴۰٪ پر بود. نمی‌دونستم این یعنی چی تا سخت یاد گرفتم.',points:['حساب اسکرو باید ۱۰۰٪ وجوه خریدار رو نگه داره، فقط بر اساس پیشرفت ساخت که مهندس مستقل تأیید کرده آزاد بشه.','توی مورد من، ۴۰٪ پر یعنی سازنده ۶۰٪ رو برای "هزینه‌های پیش از ساخت" برداشته بود.','وقتی ساخت متوقف شد، پول کافی برای استخدام پیمانکار جدید نبود. پروژه ۲۶ ماه دیر شد.','الان سه چیز رو چک می‌کنم: درصد پر بودن اسکرو، برنامهٔ آزادسازی، و شرکت مهندسی تأییدکننده.','درس: اسکرو یه چک‌باکس نیست. یه حساب بانکی زنده‌ست که بهت می‌گه سازنده دونه‌های ذخیره رو می‌خوره یا نه.'],cta:'می‌دونی پروژهٔ پیش‌فروشت الان چند درصد اسکروش پره؟ آخرین باری که چک کردی کی بود؟',tags:'#املاک_دبی #پیش_فروش #اسکرو #اشتباه #ام_آر_لیوینگ_کپیتال'},
'mistake-corridor':{title:'کریدوری که اشتباه کردم.',hook:'به جدول زمان‌بندی زیرساخت اعتماد کردم. بروشور دولت ۲۰۲۴ نوشته بود. الان ۲۰۲۶ه. مترو هنوز "در حال مطالعه‌ست." مدل سودم خراب شده.',points:['بر اساس تکمیل متروی ۲۰۲۴ خریدم که ۲۰۲۱ اعلام شده بود. سه سال بعد هنوز مناقصه هم نشده.','وعدهٔ زیرساخت قرارداد نیست. نیت سیاسیه با بودجهٔ مهندسی که عوض می‌شه.','کریدور روی کاغذ عدد خوب داشت — ولی بدون مترو، تقاضای اجاره ۳۰٪ پایین‌تر از پیش‌بینیه.','زیادی نگه داشتم امیدوار بودم مترو نجاتم بده. نشد. با قیمت تمام شده فروختم و منتقل شدم.','قانون جدیدم: فقط چیزی رو می‌خرم که امروز هست. زیرساخت آینده جایزه‌ست، هرگز پایه‌ی استدلال.'],cta:'تا حالا به خاطر باور به جدول زمان‌بندی زیرساخت، سرمایه‌گذاری بازنده نگه داشتی؟',tags:'#املاک_دبی #زیرساخت #کریدور #اشتباه #ام_آر_لیوینگ_کپیتال'},
'lifestyle-2m':{title:'۲ میلیون درهم توی دبی واقعاً چی می‌خره؟',hook:'تبلیغات نیست. واقعیت. چهارده معاملهٔ توی ۲ میلیون توی ژوئیه ۲۰۲۶ رو بررسی کردم. این تقسیم صادقانه‌ست.',points:['داون‌تاون: یک خوابه، ۷۵۰-۸۵۰ فوت، ساختمان قدیمی‌تر، شارژ ۱۸-۲۲ درهم. پارکینگ نداره.','دبی هیلز: دو خوابه، ۱۱۰۰ فوت، برج میان‌ارتفاع، ویو استخر. شارژ ۱۴ درهم. یه پارکینگ.','JVC: دو خوابه + مطالعه، ۱۳۵۰ فوت، نوساز، دو پارکینگ. شارژ ۱۲ درهم.','بیزینس بی: یک خوابه لافت، ۹۰۰ فوت، ویو کانال، ساختمان با ولت. شارژ ۲۰ درهم.','نکتهٔ جالب: JVC ۵۰٪ فضای بیشتر میده. قیمت یکسون. trade-off موقعیت و نقدشوندگیه.'],cta:'اگه الان ۲ میلیون درهم داشتی، کدوم یکی از این پنج تا رو می‌خریدی — و چرا؟',tags:'#املاک_دبی #سبک_زندگی #بودجه #مقایسه #ام_آر_لیوینگ_کپیتال'},
'sig-wouldibuy':{title:'می‌خرم؟ دبی هیلز.',hook:'رأی: شاید. ولی فقط اگه محصول درست توی خوشهٔ درست بخری. این تحلیل ۹۰ ثانیه‌ای منه.',points:['دبی هیلز ۸۰۰۰+ واحد تحویل داده و ۳۰۰۰+ دیگه داره میاد. عرضه متمرکزه، نه کمیاب.','مرکز خرید و بیمارستان زنده‌ست. مترو نیست. یعنی ۵+ سال وابستگی به ماشین.','قیمت ویلا بهتر از آپارتمان نگه داشته چون زمین توی مجموعه محدوده.','شارژ سرویس متوسطه (۱۲-۱۵ درهم) ولی ۸٪ سالانه داره میره بالا.','من به جای آپارتمان دو خوابه، تاون‌هوس سه خوابه می‌خرم. بازار اجارهٔ تاون‌هوس عمیق‌تره.'],cta:'دبی هیلز رو به عنوان یه بازار می‌بینی، یا ویلا و آپارتمان رو جدا تحلیل می‌کنی؟',tags:'#املاک_دبی #دبی_هیلز #می‌خرم #سری_امضا #ام_آر_لیوینگ_کپیتال'},
'sig-redflag':{title:'پرچم قرمز: سابقهٔ نداشتن.',hook:'سازندهٔ جدید، بروشور شیک، طرح پرداخت تهاجمی، و تیم فروشی که به جای "پروژه‌های تحویل داده" از "چشم‌انداز" حرف می‌زنه. این فیلم رو دیدم.',points:['سازنده‌های تازه‌کار هیچ سابقهٔ تحویل ندارن که کیفیت ساخت یا دقت زمان‌بندی رو تأیید کنه.','ثبت‌نام RERA مهر کیفیت نیست. مجوز فعالیته. هر تیم سرمایه‌داری می‌تونه بگیره.','طرح پرداخت "تهاجمی" — ۱٪ ماهی، ۵ سال پس از تحویل — معمولاً نشونهٔ اینه که سازنده به جریان نقدی شما برای تأمین مالی ساخت نیاز داره.','سابقهٔ نداشتن یعنی بانک پروژه‌ای بهش وام نداده. اگه بانک به سازنده اعتماد نداره، چرا تو باید داشته باشی؟','استثناء: سازندهٔ جدید زیر نظر صندوق سرمایهٔ دولتی یا پیمانکار بزرگ با ۲۰+ سال سابقه.'],cta:'از سازنده‌ای با صفر پروژهٔ تحویل داده می‌خری اگه طرح پرداخت جذاب باشه؟',tags:'#املاک_دبی #پرچم_قرمز #سازنده #احتیاط #ام_آر_لیوینگ_کپیتال'},
'office-surge':{title:'اجارهٔ دفتر ۳۱.۵٪ جهش کرده و کسی نفهمیده.',hook:'همه دارن قیمت مسکنی رو نگاه می‌کنن. بازار تجاری داره سفت می‌شه. اجارهٔ گرید B ۳۱.۵٪ رشد کرده. جای خالی ۶.۱٪.',points:['اجارهٔ دفتر گرید B توی Q2 ۲۰۲۶، ۳۱.۵٪ رشد کرده. جای خالی به ۶.۱٪ رسیده — تنگ‌ترین در ۵ سال.','۴۰٪ ساختمان‌های گرید B دبی ۱۵+ سال سن دارن و نیاز به بازسازی دارن. این نابودی عرضه‌ست.','شکاف سود بین مسکنی (۵-۶٪) و تجاری (۷-۹٪) از ۲۰۲۲ وسیع‌ترین حالته.','عرضهٔ دفتر جدید ۲۰۲۷-۲۰۲۸، ۶۰٪ پیش‌اجاره شده. بازار منتظر تموم شدن ساختمان‌ها نیست.','سرمایه‌گذارا هنوز دارن پیش‌فروش مسکنی می‌خرن در حالی که موجودی تجاری آماده سود فوری داره.'],cta:'سبدت ۱۰۰٪ مسکنیه چون می‌فهمیش، یا چون هرگز به اعداد دفتر نگاه نکردی؟',tags:'#املاک_دبی #تجاری #دفتر #سود #ام_آر_لیوینگ_کپیتال'},
'h1-drop':{title:'فروش دبی توی H1 ۲۰۲۶ ۱۶٪ افتاد. داستان واقعی.',hook:'تیترها فریاد "کندی" می‌زنن. تصویر کامل می‌گه: ۲۲۵.۷ میلیارد درهم هنوز جابجا شد. این ۱۵٪ بالاتر از H1 ۲۰۲۴ه.',points:['H1 ۲۰۲۶، ۲۲۵.۷ میلیارد درهم فروش ثبت شد — ۱۶٪ پایین‌تر از رکورد H1 ۲۰۲۵. ولی ۱۵٪ بالاتر از H1 ۲۰۲۴.','افتادگی از تنش ژئوپلیتیکی اوایل ۲۰۲۶ بود، نه بنیاد ضعیف. قیمت ۴-۷٪ اصلاح شد و ثابت موند.','میانگین قیمت هر فوت H1 ۲۰۲۶: ۱۹۰۰ درهم. H1 ۲۰۲۴: ۱۸۰۰ درهم. بازار توی ۲۴ ماه هنوز ۵.۵٪ بالاتره.','فعالیت خریدار بعد از تلاش‌های آتش‌بس به طور پیوسته برگشت.','یه فصل ترس چهار سال تقاضای ساختاری رو پاک نمی‌کنه. دبی دیگه بازار سفته‌بازی نیست.'],cta:'تیترهای H1 باعث شد مکث کنی، یا ۱۵٪ رشد نسبت به ۲۰۲۴ رو دیدی و ادامه دادی؟',tags:'#املاک_دبی #داده_بازار #H12026 #روند #ام_آر_لیوینگ_کپیتال'},

/* ============ CANVAS HELPERS ============ */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function grain(c,h){const tc=document.createElement('canvas');tc.width=c.width;tc.height=h||c.height;const tx=tc.getContext('2d');const d=tx.createImageData(tc.width,tc.height);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*30+225;d.data[i]=v;d.data[i+1]=v-3;d.data[i+2]=v-6;d.data[i+3]=18;}tx.putImageData(d,0,0);const x=c.getContext('2d');x.save();x.globalAlpha=0.07;x.drawImage(tc,0,0);x.restore();}
function finish(c,h){const x=c.getContext('2d');grain(c,h||c.height);x.globalCompositeOperation='source-over';return c;}
function footerCenter(c,h){const x=c.getContext('2d'),y=h||c.height;x.fillStyle='#F6F1E7';x.font='600 11px "Inter"';x.textAlign='center';x.fillText('MR LIVING CAPITAL  ·  LIVING PROOF. LASTING LEGACY.',c.width/2,y-22);x.fillStyle='#57A99F';x.font='500 10px "Inter"';x.fillText('mrlivingcapital.com  ·  WhatsApp +971 58 589 9112',c.width/2,y-8);}
function sourceLine(c,source,y){const x=c.getContext('2d');x.fillStyle='#8C9592';x.font='italic 500 11px "Inter"';x.textAlign='center';x.fillText('Source: '+source,c.width/2,y);}
function rrect(c,px,py,w,h,r){const x=c.getContext('2d');x.beginPath();x.moveTo(px+r,py);x.lineTo(px+w-r,py);x.quadraticCurveTo(px+w,py,px+w,py+r);x.lineTo(px+w,py+h-r);x.quadraticCurveTo(px+w,py+h,px+w-r,py+h);x.lineTo(px+r,py+h);x.quadraticCurveTo(px,py+h,px,py+h-r);x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);x.closePath();x.fill();}
function faSet(c,weight,size){const x=c.getContext('2d');x.font=weight+' '+size+'px "Vazirmatn", sans-serif';x.textAlign='right';x.direction='rtl';}
function faLines(c,text,px,py,maxW,lineH,color){const x=c.getContext('2d');x.fillStyle=color;x.textAlign='right';x.direction='rtl';const words=text.split(' ');let line='';let y=py;for(let n=0;n<words.length;n++){const testLine=line+words[n]+' ';const metrics=x.measureText(testLine);if(metrics.width>maxW&&n>0){x.fillText(line,px,y);line=words[n]+' ';y+=lineH;}else{line=testLine;}}x.fillText(line,px,y);return y+lineH;}
function wrap(c,text,maxW){const x=c.getContext('2d');const words=text.split(' ');let lines=[''];for(let w of words){const test=lines[lines.length-1]+w+' ';if(x.measureText(test).width>maxW&&lines[lines.length-1].length>0){lines.push(w+' ');}else{lines[lines.length-1]=test;}}return lines;}

async function buildPack(t,container){
container.innerHTML='<p style="color:#5A6662;font-style:italic">Generating pack for: '+t.title+'...</p>';
const grid=document.createElement('div');grid.className='figGrid';
// Cover
const cover=await renderCover(t);grid.appendChild(wrapFig(cover,'Cover (1080x1350)'));
// Idea slides
for(let i=0;i<t.points.length;i++){const slide=await renderIdea(t,t.points[i],i,t.points.length);grid.appendChild(wrapFig(slide,'Point '+(i+1)+' (1080x1350)'));}
// Closer
const closer=await renderCloser(t);grid.appendChild(wrapFig(closer,'Closer (1080x1350)'));
// Reel
const reel=await renderReel(t);grid.appendChild(wrapFig(reel,'Reel Cover (1080x1920)'));
container.innerHTML='';container.appendChild(grid);
// Captions
const caps=document.createElement('div');
const platforms=[['LinkedIn',capLinkedIn(t)],['Instagram',capInstagram(t)],['Telegram',capTelegram(t)],['WhatsApp',capWhatsApp(t)],['TikTok',capTikTok(t)],['X/Twitter',capX(t)],['Threads',capThreads(t)],['Facebook',capFacebook(t)],['WA Story',capWAStory(t)],['Reel Script',reelScript(t)]];

container.appendChild(caps);
markPublished(t);
updateJabBadge();
}

if(filterPillar)filtered=filtered.filter(t=>t.pillar===filterPillar);
if(filterType)filtered=filtered.filter(t=>t.type===filterType);
if(filterEngine)filtered=filtered.filter(t=>t.engine===filterEngine);
if(searchTerm)filtered=filtered.filter(t=>t.title.toLowerCase().includes(searchTerm.toLowerCase())||t.sub.toLowerCase().includes(searchTerm.toLowerCase()));
for(let t of filtered){cards.appendChild(topicCard(t));}
view.appendChild(cards);bindCards();
}

function topicCard(t){
const div=document.createElement('div');div.className='card';div.dataset.key=t.key;
const pub=isPublished(t.key)?'<span class="publishedTag">PUBLISHED</span>':'';
const faLabel=FA[t.key]?' · FA':'';
div.innerHTML='<div class="prio"><span class="pnum">'+(t.key.match(/\\d+/)||[''])[0]+'</span><span class="ptype '+t.type+'">'+t.type.toUpperCase()+'</span>'+pub+'</div><h3>'+t.title+'</h3><div class="pillar">'+t.pillar+' · '+(t.engine||'')+faLabel+'</div><div class="why">'+t.sub+'</div><div class="asof">As of: '+t.asof+'</div><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn" onclick="generatePost(TOPICS.find(x=>x.key===\''+t.key+'\'))">Generate Pack</button><button class="btn ghost" onclick="viewSub(TOPICS.find(x=>x.key===\''+t.key+'\'))">View</button></div>';
return div;
}

function bindCards(){}

}
view.appendChild(cards);bindCards();
}

function suggestType(){
const counts={jab:0,hook:0,mistake:0};
for(let t of TOPICS)counts[t.type]=(counts[t.type]||0)+1;
const total=TOPICS.length;
const ratios={jab:counts.jab/total,hook:counts.hook/total,mistake:counts.mistake/total};
if(ratios.jab<0.6)return'jab';
if(ratios.hook<0.3)return'hook';
return'mistake';
}

function jabStatus(){
const counts={jab:0,hook:0,mistake:0};
for(let t of TOPICS)counts[t.type]=(counts[t.type]||0)+1;
return counts;
}

function updateJabBadge(){
const counts=jabStatus();
const badge=document.getElementById('jabBadge');
if(badge)badge.textContent='JAB '+counts.jab+' · HOOK '+counts.hook+' · MISTAKE '+counts.mistake;
}

/* ============ PUBLISHING / TRACKING ============ */
function isPublished(key){try{const p=JSON.parse(localStorage.getItem('mrlc_pub')||'[]');return p.includes(key);}catch(e){return false;}}
function markPublished(t){try{const p=JSON.parse(localStorage.getItem('mrlc_pub')||'[]');if(!p.includes(t.key)){p.push(t.key);localStorage.setItem('mrlc_pub',JSON.stringify(p));}}catch(e){}}
function getPub(){try{return JSON.parse(localStorage.getItem('mrlc_pub')||'[]');}catch(e){return[];}}

/* ============ PASSWORD GATE ============ */
async function tryPw(){
const input=document.getElementById('gatePw').value;
const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));
const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
if(hex==='a3b8c9d0e1f2g3h4i5j6k7l8m9n0o1p2q3r4s5t6u7v8w9x0y1z2a3b4c5d6e7f8'){
document.getElementById('gate').style.display='none';
init();
}else{
document.getElementById('gateErr').style.display='block';
}
}
// Simplified gate for deployment - use direct comparison
tryPw=function(){
const input=document.getElementById('gatePw').value;
if(input==='MRLC-2026'){
document.getElementById('gate').style.display='none';
init();
}else{
document.getElementById('gateErr').style.display='block';
}
};

/* ============ INIT ============ */
function init(){
const tabs=document.getElementById('tabs');
const tabNames=[{id:'brief',label:'DAILY BRIEF'},{id:'bank',label:'TOPIC BANK'},{id:'week',label:'CADENCE'},{id:'playbook',label:'PLAYBOOK'},{id:'convo',label:'CONVERSATION'}];
for(let t of tabNames){
const btn=document.createElement('button');btn.className='tab';btn.textContent=t.label;btn.dataset.tab=t.id;
btn.onclick=function(){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));this.classList.add('on');
if(t.id==='brief')showBrief();
else if(t.id==='bank')showBank();
else if(t.id==='week')showWeek();
else if(t.id==='playbook')showPlaybook();
else if(t.id==='convo')showConvo();
};
tabs.appendChild(btn);
}
// Filter bar
const filterBar=document.getElementById('filterBar');
filterBar.style.display='flex';
const pillarSel=document.getElementById('filterPillar');
const pillars=[...new Set(TOPICS.map(t=>t.pillar))];
for(let p of pillars){const opt=document.createElement('option');opt.value=p;opt.textContent=p;pillarSel.appendChild(opt);}
const engineSel=document.getElementById('filterEngine');
const engines=[...new Set(TOPICS.map(t=>t.engine).filter(Boolean))];
for(let e of engines){const opt=document.createElement('option');opt.value=e;opt.textContent=e;engineSel.appendChild(opt);}
function applyFilters(){showBank(pillarSel.value,filterType.value,engineSel.value,filterSearch.value);}
pillarSel.onchange=applyFilters;
document.getElementById('filterType').onchange=applyFilters;
engineSel.onchange=applyFilters;
document.getElementById('filterSearch').oninput=applyFilters;
// Date chip
const now=new Date();
document.getElementById('dateChip').textContent=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' GST';
updateJabBadge();
// Show brief by default
tabs.children[0].classList.add('on');showBrief();
}

document.getElementById('gateBtn').onclick=tryPw;
document.getElementById('gatePw').onkeydown=function(e){if(e.key==='Enter')tryPw();};
</script>
