<body>
<div class="grain"></div>
<div class="app-container">
<aside class="sidebar">
  <div class="brand-mark" id="sbBrand">MR Living Capital</div>
  <div class="brand-tagline" id="sbTagline">Living Proof. Lasting Legacy.</div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnEn" onclick="setLang('en')">English</button>
    <button class="lang-btn" id="btnFa" onclick="setLang('fa')">فارسی</button>
  </div>
  <div class="nav-section">
    <div class="nav-label" id="navBuild">Build Slide</div>
    <button class="nav-btn active" onclick="showTab('cover')" id="navCover">Cover Slide</button>
    <button class="nav-btn" onclick="showTab('data')" id="navData">Data + Features</button>
    <button class="nav-btn" onclick="showTab('feature')" id="navFeature">Feature + Stats</button>
    <button class="nav-btn" onclick="showTab('contact')" id="navContact">Contact / Final</button>
    <button class="nav-btn" onclick="showTab('copy')" id="navCopy">Copy Generator</button>
  </div>
  <div class="nav-section">
    <div class="nav-label" id="navBrain">Brain</div>
    <button class="nav-btn" onclick="showTab('scenario')" id="navScenario">Scenario Analyzer</button>
    <button class="nav-btn" onclick="showTab('corridor')" id="navCorridor">Corridor Compare</button>
    <button class="nav-btn" onclick="showTab('redflag')" id="navRedflag">Red Flag Detector</button>
  </div>
  <div style="margin-top:auto; font-family:var(--font-ui); font-size:0.55rem; color:var(--sand); text-align:center; padding-top:16px;" id="versionText">War Room Engine v2.1<br>Locked Brand System</div>
</aside>
<main class="main-content">
  <div class="top-bar">
    <div class="page-title" id="pageTitle">Cover Slide</div>
    <div class="top-actions">
      <button class="btn btn-secondary" onclick="resetForm()" id="btnReset">Reset</button>
      <button class="btn btn-primary" onclick="generateSlide()" id="btnGenerate">Generate</button>
      <button class="btn btn-primary" onclick="exportSlide()" id="btnExport" style="display:none;">Export HTML</button>
    </div>
  </div>
  <div class="workspace">
    <div class="panel panel-left">
      <div id="tab-cover" class="section active">
        <div class="form-group"><label class="form-label" id="lblHeadline">Headline</label><input class="form-input" id="inHeadline" placeholder="WHY GLOBAL INVESTORS ARE WATCHING..."></div>
        <div class="form-group"><label class="form-label" id="lblAccent">Accent Words (turquoise)</label><input class="form-input" id="inAccent" placeholder="ABU DHABI"></div>
        <div class="form-group"><label class="form-label" id="lblSub">Subheadline</label><textarea class="form-textarea" id="inSub" placeholder="The next wave of growth isn't one project..."></textarea></div>
        <div class="form-group"><label class="form-label" id="lblSubAccent">Accent Phrase in Subheadline</label><input class="form-input" id="inSubAccent" placeholder="government-backed strategy"></div>
        <div class="form-group"><label class="form-label" id="lblImage">Image URL</label><input class="form-input" id="inImage" placeholder="https://... or leave blank for placeholder"></div>
        <div class="form-group"><label class="form-label" id="lblHeadshot">Headshot URL (optional)</label><input class="form-input" id="inHeadshot" placeholder="https://... your profile photo"></div>
        <div class="form-group"><label class="form-label" id="lblPillars">4 Bottom Pillars (comma separated)</label><input class="form-input" id="inPillars" value="Government Vision,Global Connectivity,World-Class Infrastructure,Long-Term Value Creation"></div>
        <div class="form-group"><label class="form-label">Show Socials in Footer?</label><select class="form-select" id="inShowSocials"><option value="yes">Yes</option><option value="no">No</option></select></div>
      </div>
      <div id="tab-data" class="section">
        <div class="form-group"><label class="form-label">Headline</label><input class="form-input" id="inDataHeadline" placeholder="ABU DHABI IS INVESTING FOR DECADES, NOT YEARS."></div>
